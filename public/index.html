  }catch(e){
    const m=(e&&(e.message||e.error_description))||'';
    let clair="Connexion impossible.";
    if(/anonymous.*disabled|not enabled/i.test(m)) clair="Les comptes anonymes sont désactivés côté serveur.";
    else if(/rate limit|429|too many/i.test(m))    clair="Trop de comptes créés depuis cet appareil. Réessaie dans une heure.";
    /* Le compte a pu être créé et c'est la relecture de l'état qui a échoué :
       parler de connexion serait trompeur. */
    else if(USER)                                  clair="Compte ouvert, mais tes données n'ont pas pu être relues"+(m?" ("+m+")":"")+".";
    else if(m)                                     clair="Connexion impossible : "+m;
    err.textContent=clair+" Tes données resteront sur ce téléphone.";
    console.warn('Échec de connexion anonyme :',e);
    setTimeout(()=>{
      let s=null; try{ s=localState(); }catch(e2){}
      let ok=false; try{ ok=!!(s&&apply(s)); }catch(e2){ console.warn('Repli local impossible :',e2); }

  }

  const local=localState();
  /* À la récupération le compte passe devant ; s'il est vide, on garde ce qui
     était là plutôt que de le remplacer par du néant. */
  const pick=forcerDistant ? (remote||local)
    : ((remote&&local)?((remote.ts||0)>=(local.ts||0)?remote:local):(remote||local));
  const ok=apply(pick);
  if(forcerDistant&&!remote)
    showErr("Compte ouvert, mais il ne contenait aucune sauvegarde. Ce qui était sur cet appareil a été conservé et lui est maintenant rattaché.",'info');
  if(PSEUDO) try{ localStorage.setItem(PKEY,PSEUDO) }catch(e){}
  if(!remote||(local&&(local.ts||0)>(remote.ts||0))) save();

async function rattacherALaVolee(mail){

    if(error) throw error;
    return ["Un lien de confirmation vient de partir vers "+mail+". Ouvre-le pour rattacher ton compte ; d'ici là tu peux commencer normalement.",'ok'];

        ? "cette adresse est déjà rattachée à un autre compte"
      : /rate limit|429|too many|for security/i.test(t)
        ? "trop de messages ont été envoyés depuis cet appareil"

  }
}

/* --- récupération sur un nouvel appareil --- */
let RECUPMAIL=null;
function recupScreen(){
  bar(false); RECUPMAIL=null;
  app.innerHTML=`<div class="screen" id="pseudo">
    <h1 class="display">Retrouver<br>mon compte</h1>
    <p>Saisis l'adresse que tu as rattachée à ton compte. Tu recevras un code à six chiffres. Pas de mot de passe à retenir.</p>
    <input id="pin" type="email" inputmode="email" autocomplete="email" autocapitalize="off"
      spellcheck="false" placeholder="prenom@exemple.fr" enterkeyhint="go">
    <div class="err" id="perr"></div>
    <div class="ok2" id="pok"></div>
    <button class="lien" onclick="retourAccueil()">Revenir en arrière</button>
  </div>`;
  setFoot(`<button class="btn" onclick="demanderCode()">Recevoir mon code</button>`,true);
  const i=document.getElementById('pin');
  i.addEventListener('keydown',e=>{if(e.key==='Enter')demanderCode()});
  setTimeout(()=>i.focus(),260);
}
function retourAccueil(){ USER?compteScreen():pseudoScreen(); }

async function demanderCode(){
  const i=document.getElementById('pin'), err=document.getElementById('perr'), ok=document.getElementById('pok');
  const m=(i.value||'').trim().toLowerCase();
  ok.textContent=''; err.textContent='';
  if(!valideMail(m)){ err.textContent="Cette adresse n'a pas l'air valide."; return; }
  if(!sb){ err.textContent="Pas de connexion au serveur : impossible pour l'instant."; return; }
  err.textContent="Envoi du code…";
  try{
    const {error}=await sb.auth.signInWithOtp({email:m,options:{shouldCreateUser:false}});
    if(error) throw error;
    RECUPMAIL=m; codeScreen();
  }catch(e){
    const t=(e&&(e.message||e.error_description))||'';
    err.textContent = /signups not allowed|not found|disabled/i.test(t)
        ? "Aucun compte n'est rattaché à cette adresse."
      : /rate limit|429|too many|for security/i.test(t)
        ? "Trop de demandes. Réessaie dans quelques minutes."
      : "Envoi impossible"+(t?" : "+t:".");
  }
}

function codeScreen(){
  bar(false);
  app.innerHTML=`<div class="screen" id="pseudo">
    <h1 class="display">Ton code</h1>
    <p>Six chiffres viennent d'être envoyés à ${RECUPMAIL}. Il reste valable une heure. Pense à regarder tes indésirables.</p>
    <input id="pin" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
      placeholder="000000" enterkeyhint="go">
    <div class="err" id="perr"></div>
    <p class="warn">En validant, les données de ton compte remplaceront celles présentes sur cet appareil. Si le compte est vide, rien ne sera perdu.</p>
    <button class="lien" onclick="recupScreen()">Changer d'adresse</button>
  </div>`;
  setFoot(`<button class="btn" onclick="validerCode()">Ouvrir mon compte</button>`,true);
  const i=document.getElementById('pin');
  i.addEventListener('keydown',e=>{if(e.key==='Enter')validerCode()});
  setTimeout(()=>i.focus(),260);
}

async function validerCode(){
  const i=document.getElementById('pin'), err=document.getElementById('perr');
  const c=(i.value||'').replace(/\D/g,'');
  if(c.length!==6){ err.textContent="Le code fait six chiffres."; return; }
  err.textContent="Vérification…";
  try{
    /* On ne se déconnecte pas avant : si le code est refusé, la session en
       cours doit survivre. Un compte anonyme quitté serait perdu pour de bon.
       verifyOtp remplace la session de lui-même quand il réussit.            */
    const {data,error}=await sb.auth.verifyOtp({email:RECUPMAIL,token:c,type:'email'});
    if(error) throw error;
    USER=data.user;
    await afterLogin(true);
  }catch(e){
    const t=(e&&(e.message||e.error_description))||'';
    err.textContent = /expired|invalid/i.test(t)
        ? "Code incorrect ou expiré. Demande-en un nouveau."
        : "Vérification impossible"+(t?" : "+t:".");
  }
}

/* ton : 'ok' pour une bonne nouvelle, 'info' pour une réserve, rien pour une panne. */
function showErr(m,ton){
  const T={ok:['#2E7D4F','✓'],info:['#B8860B','•']}[ton]||['#C0392B','⚠'];
  let b=document.getElementById('errbar');
  if(!b){b=document.createElement('div');b.id='errbar';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;color:#fff;'+
      'font:11.5px/1.5 monospace;padding:10px 12px;white-space:pre-wrap;cursor:pointer;max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch';
    b.onclick=()=>b.remove(); document.body.appendChild(b);}
  b.style.background=T[0];
  b.textContent=T[1]+' '+m+'\n(touche pour masquer)';
  if(ton){clearTimeout(showErr.t); showErr.t=setTimeout(()=>{const x=document.getElementById('errbar'); if(x&&x===b)x.remove()},9000);}
}
window.addEventListener('error',e=>showErr(e.message+(e.lineno?' — ligne '+e.lineno:'')));
window.addEventListener('unhandledrejection',e=>showErr((e.reason&&e.reason.message)||String(e.reason)));

function codeDeLURL(){
  try{ const c=new URLSearchParams(location.search).get('s');
       if(c) history.replaceState({},'',location.pathname);
       return c; }catch(e){ return null; }
}
/* Supabase renvoie ici après la confirmation d'adresse, avec le type dans le
   fragment. Il faut le lire avant createClient, qui le consomme et l'effacer.  */
function retourDeMail(){
  try{
    const f=(location.hash||'').replace(/^#/,'');
    if(!f||!/access_token=/.test(f)) return;
    const t=new URLSearchParams(f).get('type')||'';
    if(/email/.test(t)) MAILRETOUR="Adresse confirmée. Ton compte est maintenant récupérable sur un autre appareil.";
  }catch(e){}
}
async function boot(){
  retourDeMail();
  const recu=codeDeLURL();
  try{ await boot_(); if(recu) setTimeout(()=>importer(recu),900); }
  catch(e){ showErr('Démarrage : '+e.message); const s=localState(); (s&&apply(s)&&FINI)?prog():(SEANCES.length?listeLibres():home()); }
}
async function boot_(){
  if(!configured()){
    if(!SB_URL.includes('COLLE')&&!SB_KEY.includes('COLLE'))
      showErr("Configuration Supabase invalide. SB_URL doit ressembler à https://xxxx.supabase.co et SB_KEY commencer par eyJ. L'app tourne en mode local.");
    const s=localState(); badge(false);
    (s&&apply(s)&&FINI)?prog():(SEANCES.length?listeLibres():home());
    return;
  }
  try{ sb=window.supabase.createClient(SB_URL.trim(),SB_KEY.trim()); }
  catch(e){
    showErr('Client Supabase : '+e.message+' — mode local.');
    const s=localState(); badge(false); (s&&apply(s)&&FINI)?prog():(SEANCES.length?listeLibres():home()); return;
  }
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session){
      USER=data.session.user; PSEUDO=sansBalise(localStorage.getItem(PKEY))||'toi';
      await afterLogin(); return;
    }
  }catch(e){}
  pseudoScreen();
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
boot();
</script>
