<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repère</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Repère">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{--fonte:#14161A;--craie:#EFF1EC;--bleu:#1B4FA8;--jaune:#EFC429;--vert:#2E7D4F;--rouge:#C0392B;--gris:#7C8279;--ligne:rgba(20,22,26,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--fonte);font-family:'Instrument Sans',system-ui,sans-serif;color:var(--fonte);display:flex;justify-content:center}
#phone{width:100%;max-width:430px;min-height:100dvh;background:var(--craie);position:relative;overflow-x:hidden;display:flex;flex-direction:column}
.display{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.005em;line-height:.92}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.mono{font-family:'JetBrains Mono',monospace}

#topbar{position:sticky;top:0;z-index:20;background:var(--craie);padding:14px 20px 10px;border-bottom:1px solid var(--ligne)}
#topbar.hidden{display:none}
.barhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.bl{display:flex;align-items:center;gap:10px}
.bk{width:27px;height:27px;flex:none;border:1.5px solid var(--ligne);background:#fff;border-radius:3px;font-size:14px;line-height:1;cursor:pointer;color:var(--fonte);padding:0}
.bk:active{background:var(--fonte);color:var(--craie)}
.bk.hidden{display:none}
.pad.nofoot{padding-bottom:44px}
.barbell{position:relative;height:34px;display:flex;align-items:center}
.shaft{position:absolute;left:0;right:0;top:50%;height:5px;transform:translateY(-50%);background:linear-gradient(var(--gris),#5c6159);border-radius:3px;opacity:.5}
.plates{position:relative;display:flex;gap:3px;align-items:center;height:100%;padding-left:6px}
.plate{width:9px;border-radius:2px;background:rgba(20,22,26,.1);transition:background .35s,height .35s}
.collar{position:absolute;right:0;top:50%;transform:translateY(-50%);width:8px;height:16px;border-radius:2px;background:#5c6159;opacity:.5}

.screen{flex:1;display:flex;flex-direction:column;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:24px 20px 178px}

#home{background:var(--fonte);color:var(--craie);flex:1;display:flex;flex-direction:column;
  justify-content:space-between;padding:40px 26px 120px;gap:30px}
#home .marque{color:var(--jaune);letter-spacing:.2em}
#home h1{font-size:clamp(58px,19vw,86px);margin:20px 0 0;letter-spacing:-.01em}
#home .accroche{margin-top:14px;font-size:19px;font-weight:600;line-height:1.3;color:var(--craie)}
#home .lede{margin-top:14px;font-size:15.5px;line-height:1.55;color:rgba(239,241,236,.6);max-width:33ch}
.pts{list-style:none;display:flex;flex-direction:column;gap:0}
.pts li{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-top:1px solid rgba(239,241,236,.13)}
.pts li:last-child{border-bottom:1px solid rgba(239,241,236,.13)}
.pts i{flex:none;width:4px;height:34px;border-radius:2px;margin-top:2px}
.pts b{display:block;font-size:15.5px;font-weight:600;margin-bottom:3px}
.pts span{display:block;font-size:13.5px;line-height:1.45;color:rgba(239,241,236,.55)}
.barre{display:flex;align-items:center;gap:0;height:64px}
.barre .tige{flex:1;height:6px;border-radius:3px;background:linear-gradient(rgba(239,241,236,.5),rgba(239,241,236,.2))}
.barre .disques{display:flex;gap:4px;align-items:center;padding:0 5px}
.barre .disques i{display:block;width:11px;border-radius:2px}

h2.q{font-size:29px;line-height:1.05;margin-bottom:6px}
.hint{color:var(--gris);font-size:14px;line-height:1.45;margin-bottom:22px}
.hint b{color:var(--fonte);font-weight:600}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;background:#fff;border:1.5px solid var(--ligne);border-radius:3px;padding:15px 16px;font:inherit;font-size:16px;color:var(--fonte);transition:border-color .14s,transform .14s}
.opt:active{transform:scale(.988)}
.opt.sel{border-color:var(--fonte);background:var(--fonte);color:var(--craie)}
.opt .tick{width:16px;height:16px;flex:none;border:1.5px solid var(--ligne);border-radius:2px}
.opt.sel .tick{background:var(--jaune);border-color:var(--jaune)}
.opt small{display:block;color:var(--gris);font-size:13px;margin-top:2px;line-height:1.35}
.opt.sel small{color:rgba(239,241,236,.55)}
.opt[disabled]{opacity:.32;cursor:not-allowed}

.prow{border-top:1px solid var(--ligne);padding:15px 0}
.prow:last-of-type{border-bottom:1px solid var(--ligne)}
.prow .g{font-size:16.5px;font-weight:600;margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prow .g span{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--gris);letter-spacing:.08em;text-transform:uppercase;flex:none}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1.5px solid var(--ligne);background:#fff;border-radius:3px;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--fonte)}
.pchip.sel{background:var(--fonte);color:var(--craie);border-color:var(--fonte)}
.pchip.any.sel{background:var(--gris);border-color:var(--gris)}
.recap{border:1px solid rgba(239,241,236,.14);border-radius:3px;padding:4px 15px 10px;margin:24px 0 30px}
.rh,.chx{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(239,241,236,.45);padding:13px 0 4px}
.chx{padding:0 0 4px;color:rgba(239,241,236,.45)}
.rrow2{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid rgba(239,241,236,.11)}
.rk{font-size:13.5px;color:rgba(239,241,236,.55);flex:none}
.rv{font-size:14px;text-align:right;line-height:1.4}
.qwarn{background:rgba(239,196,41,.16);border-left:3px solid var(--jaune);padding:13px 14px;border-radius:0 3px 3px 0;margin-bottom:20px;font-size:14px;line-height:1.55}
.qwarn button{display:block;margin-top:10px;background:none;border:none;font:inherit;font-size:13.5px;color:var(--bleu);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;text-align:left}
.prow.off .g,.prow.off .pchip:not(.non){opacity:.35}
.pchip.non{border-style:dashed;color:var(--gris)}
.pchip.non.sel{background:var(--rouge);border-color:var(--rouge);color:#fff;opacity:1;border-style:solid}
.pnote.jaune{background:rgba(239,196,41,.16);border-left:3px solid var(--jaune);color:var(--fonte)}
.pnote{margin-top:16px;font-size:13.5px;line-height:1.5;color:var(--gris);background:rgba(20,22,26,.045);padding:12px 13px;border-radius:3px}
.allfine{width:100%;margin-top:12px;padding:14px;border:1.5px dashed var(--ligne);background:transparent;border-radius:3px;font:inherit;font-size:14.5px;color:var(--gris);cursor:pointer}

.loads{display:flex;flex-direction:column;gap:11px}
.load{background:#fff;border:1.5px solid var(--ligne);border-radius:3px;padding:13px 15px}
.load .top{display:flex;align-items:center;justify-content:space-between}
.load label{font-size:15.5px;font-weight:500}
.ctl{display:flex;align-items:center;gap:9px}
.ctl button{width:33px;height:33px;border:1.5px solid var(--ligne);background:var(--craie);border-radius:3px;font:inherit;font-size:19px;cursor:pointer;color:var(--fonte);line-height:1}
.ctl button:active{background:var(--fonte);color:var(--craie)}
.val{width:66px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700}
.val span{font-size:11px;color:var(--gris);font-weight:400}
.valw{display:inline-flex;align-items:baseline;gap:4px;width:96px;justify-content:flex-end}
.valin{width:58px;background:none;border:none;border-bottom:1.5px solid var(--ligne);text-align:right;
  font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;color:var(--fonte);padding:2px 0;outline:none}
.valin:focus{border-bottom-color:var(--bleu)}
.valw .u{font-size:11px;color:var(--gris)}
.load .dk{margin-top:9px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--gris);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.load.unk .top{opacity:.3;pointer-events:none}
.load.unk .dk{color:var(--bleu)}

.imc{margin-top:16px;background:var(--fonte);color:var(--craie);border-radius:3px;padding:16px}
.imc .ih{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:15px}
.imc .ih span{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(239,241,236,.5)}
.imc .ih b{font-family:'Anton',sans-serif;font-size:31px;font-weight:400}
.iscale{position:relative;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--bleu) 0 17.5%,var(--vert) 17.5% 50%,var(--jaune) 50% 75%,var(--rouge) 75% 100%)}
.iscale i{position:absolute;top:50%;width:3px;height:19px;background:var(--craie);border-radius:2px;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--fonte)}
.ilabels{position:relative;height:13px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:rgba(239,241,236,.45)}
.ilabels span{position:absolute;transform:translateX(-50%)}
.inote{margin-top:14px;font-size:12.5px;line-height:1.55;color:rgba(239,241,236,.6)}

.foot{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:30}
.foot-in{width:100%;max-width:430px;padding:14px 20px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--craie) 26%);display:flex;gap:10px;pointer-events:auto}
.btn{flex:1;padding:16px;border:none;border-radius:3px;background:var(--fonte);color:var(--craie);font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:16px;cursor:pointer}
.btn[disabled]{opacity:.28;cursor:not-allowed}
.btn.ghost{flex:none;width:56px;background:transparent;border:1.5px solid var(--ligne);color:var(--fonte);font-size:19px}
.foot.dark .foot-in{background:linear-gradient(transparent,var(--fonte) 26%)}
.foot.dark .btn{background:var(--jaune);color:var(--fonte)}

/* ---- barre de navigation du bas ---- */
.foot.tabs .foot-in{background:var(--craie);border-top:1.5px solid var(--ligne);padding:0 0 env(safe-area-inset-bottom);gap:0}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 10px;background:none;border:none;font:inherit;cursor:pointer;color:var(--gris);
  border-top:2.5px solid transparent;margin-top:-1.5px}
.tab .ti{font-size:17px;line-height:1}
.tab .tn{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.sel{color:var(--fonte);border-top-color:var(--fonte)}
.tab.sel .tn{font-weight:700}
/* Écran qui a déjà son bouton principal : les onglets passent dessous.
   column-reverse place le premier enfant du DOM (.tabsup) tout en bas.      */
.tabsup{width:100%;max-width:430px;display:flex;background:var(--craie);
  border-top:1.5px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom);pointer-events:auto}
.foot.avec-tabs{flex-direction:column-reverse;align-items:center}
.foot.avec-tabs .foot-in{padding-bottom:10px}
.foot.dark.avec-tabs .tabsup{background:var(--fonte);border-top-color:rgba(239,241,236,.16)}
.foot.dark.avec-tabs .tab{color:rgba(239,241,236,.5)}
.foot.dark.avec-tabs .tab.sel{color:var(--craie);border-top-color:var(--jaune)}
.zone-rouge{margin-top:34px;padding:16px;border:1.5px solid rgba(192,57,43,.55);border-radius:3px;background:rgba(192,57,43,.09)}
.zone-rouge b{display:block;font-size:15px;margin-bottom:7px;color:#E8705F}
.zone-rouge span{display:block;font-size:13px;line-height:1.55;color:rgba(239,241,236,.6);margin-bottom:14px}
.zone-rouge button{width:100%;padding:13px;border:none;border-radius:3px;background:var(--rouge);color:#fff;
  font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:14px;cursor:pointer}

#gen{background:var(--fonte);color:var(--craie);align-items:center;justify-content:center;text-align:center;padding:40px 30px}
#gen .display{font-size:34px;margin-bottom:14px}
#gen .jauge{width:min(300px,72vw);height:7px;border-radius:4px;background:rgba(239,241,236,.14);overflow:hidden;margin:26px auto 14px}
#gen .jauge i{display:block;height:100%;width:0;border-radius:4px;background:var(--jaune);transition:width .22s linear}
#gen .pct{font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(239,241,236,.6);letter-spacing:.06em}

#diag{background:var(--fonte);color:var(--craie)}
#diag h2{font-size:38px;margin:12px 0 0}
#diag .sub{color:rgba(239,241,236,.62);font-size:15.5px;line-height:1.5;margin-top:14px}
.vol{margin:26px 0 30px;border:1px solid rgba(239,241,236,.13);border-radius:3px;padding:16px 15px 13px}
.vol .vh{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(239,241,236,.42);margin-bottom:14px}
.vrow{margin-bottom:13px}
.vrow:last-child{margin-bottom:0}
.vrow .vt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.vrow .vn{font-size:14px;font-weight:500}
.vrow .vv{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(239,241,236,.55)}
.vrow .vv b{color:var(--jaune);font-weight:700}
.vrow .vv.ok b{color:var(--vert)}
.vbar{display:flex;gap:2.5px;align-items:center;height:15px}
.vbar i{display:block;flex:1;height:100%;border-radius:1.5px;background:rgba(239,241,236,.3)}
.vbar i.miss{background:var(--jaune)}
.vbar i.ok{background:var(--vert)}
.vlegend{margin-top:14px;padding-top:12px;border-top:1px solid rgba(239,241,236,.13);font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(239,241,236,.42)}
.vlegend em{font-style:normal;color:var(--jaune)}
.finding{border-top:1px solid rgba(239,241,236,.14);padding:19px 0;display:flex;gap:14px}
.finding .badge{flex:none;width:26px;height:26px;border-radius:2px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--fonte)}
.finding h3{font-size:17.5px;margin-bottom:6px;font-weight:600}
.finding p{font-size:14.5px;line-height:1.55;color:rgba(239,241,236,.65)}

/* --- programme --- */
.head{padding:20px 20px 14px;border-bottom:1px solid var(--ligne)}
.head h2{font-size:31px;margin:8px 0 0}
.head .meta{margin-top:9px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gris);line-height:1.5}
.weeks{display:flex;gap:6px;padding:12px 20px 0;overflow-x:auto;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:none;position:relative;width:42px;padding:8px 0;text-align:center;border:1.5px solid var(--ligne);border-radius:3px;background:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;color:var(--fonte)}
.wk.sel{background:var(--fonte);color:var(--craie);border-color:var(--fonte)}
.wk i{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--vert)}
.rpeband{margin:11px 20px 0;padding:10px 13px;background:var(--fonte);color:var(--craie);border-radius:3px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.rpeband .l{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(239,241,236,.55)}
.rpeband .r{font-size:13px;color:rgba(239,241,236,.85)}
.rpeband b{color:var(--jaune)}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.headrow h2{margin:0}
.wsel{flex:none;background:var(--fonte);color:var(--craie);border:none;border-radius:3px;padding:9px 10px;
  font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--craie) 50%),linear-gradient(135deg,var(--craie) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.sect{display:flex;gap:0;border-bottom:1.5px solid var(--ligne);margin:4px 0 18px}
.stab{flex:1;padding:11px 4px;background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;
  font:inherit;font-size:13.5px;color:var(--gris);cursor:pointer}
.stab.sel{color:var(--fonte);font-weight:600;border-bottom-color:var(--fonte)}
.depli{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:1.5px dashed var(--ligne);
  border-radius:3px;padding:11px 13px;font:inherit;font-size:13.5px;color:var(--gris);cursor:pointer;margin-bottom:12px}
.deplic{margin-bottom:14px}
.depln{background:#fff;border:1.5px solid var(--ligne);border-radius:3px;padding:12px 13px;margin-bottom:8px}
.depln b{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin-bottom:5px}
.depln p{font-size:14px;line-height:1.5}
.echh{font-size:14px;color:var(--gris);margin-bottom:16px}
.echl{border-top:1px solid var(--ligne);padding:14px 0}
.echl:last-child{border-bottom:1px solid var(--ligne)}
.echt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.echn{font-size:16px;font-weight:600}
.echd{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gris);flex:none}
.echx{font-size:14.5px;line-height:1.55;color:#3a3f45}
.echb{margin-top:9px;background:none;border:none;padding:0;font:inherit;font-size:13.5px;color:var(--bleu);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.colt{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:19px;margin-bottom:10px;line-height:1.05}
.coli{font-size:15px;line-height:1.6;color:#3a3f45;margin-bottom:18px}
.coll{border-top:1px solid var(--ligne);padding:13px 0}
.coln{font-size:15.5px;font-weight:600;display:block;margin-bottom:4px}
.colx{font-size:14.5px;line-height:1.55;color:#3a3f45}
.coln2{margin-top:18px;background:var(--fonte);color:rgba(239,241,236,.85);padding:14px;border-radius:3px;font-size:14.5px;line-height:1.55}
.colw{margin-top:14px;font-size:12.5px;line-height:1.5;color:var(--gris)}
.days{display:flex;gap:7px;padding:13px 20px 4px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;padding:9px 14px;border:1.5px solid var(--ligne);border-radius:3px;background:#fff;font-family:'JetBrains Mono',monospace;font-size:12.5px;cursor:pointer;color:var(--fonte);white-space:nowrap}
.day.bonus{border-style:dashed;background:transparent;color:var(--gris)}
.day.sport{border-style:dotted;background:transparent;color:var(--bleu);border-color:var(--bleu)}
.day.sel{background:var(--fonte);color:var(--craie);border-color:var(--fonte);border-style:solid}
.day.bonus.sel{background:var(--jaune);color:var(--fonte);border-color:var(--jaune)}
.day.sport.sel{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.day.done::after{content:" ✓"}

function sportWarn(){
  const l=[];

  if(A.axe===1&&aTrait('cardio')) l.push("<b>Tu as choisi l'axe souffle pour ta séance bonus</b>, or tes pratiques couvrent déjà le cardio. L'axe mobilité te servirait davantage.");
  if(A.axe===2&&aTrait('leger')&&sportsInfo().length===1) l.push("<b>Tu as choisi l'axe mobilité</b>, or le yoga et le pilates la travaillent déjà mieux que nous. L'axe points faibles serait plus utile.");

  return l.join('<br><br>');
}
