  p:"Bien plus tolérant pour le bas du dos que le rowing barre. À privilégier si tu as signalé une gêne lombaire."},
 ra:{n:"Rowing australien",m:"Dos, arrière d'épaule",img:"Inverted_Row",pat:'th',pat2:'fc',eq:3,ch:'aucune',d:12,
  e:"Barre à hauteur de hanches, suspendu dessous, corps en ligne, talons au sol. Tire la poitrine vers la barre en serrant les omoplates, puis redescends bras tendus sans casser la ligne du bassin.",
  err:["Bassin qui s'affaisse pendant la montée.","Tirer le ventre plutôt que la poitrine vers la barre."],
  p:"Pour durcir, abaisse la barre ou surélève les pieds plutôt que d'ajouter des répétitions au-delà de quinze."},

 sq:{n:"Squat barre",m:"Quadriceps, fessiers",img:"Barbell_Squat",pat:'eg',pat2:'fh',eq:1,ch:'kg',d:80,capDeb:8,
  e:"Barre sur le haut des trapèzes, mains posées largeur confortable, coudes sous la barre. Inspire, gaine, puis descends en poussant les genoux vers l'extérieur et les hanches vers l'arrière. Vise au minimum la cuisse parallèle au sol, puis remonte en poussant le sol avec tout le pied.",
  err:["Talons qui décollent, souvent un manque de mobilité de cheville que des chaussures à talon corrigent immédiatement.","Genoux qui rentrent vers l'intérieur à la remontée.","S'arrêter bien au-dessus du parallèle en chargeant lourd, ce qui donne l'illusion de progresser."],
  p:"L'amplitude passe avant la charge : une série à RPE 8 en descendant sous le parallèle vaut mieux qu'une série à RPE 9 écourtée. Filme-toi de côté une fois par cycle pour vérifier."},
 pr:{n:"Presse à cuisses",m:"Quadriceps, fessiers",img:"Leg_Press",pat:'eg',pat2:'fh',eq:0,ch:'kg',d:120,
  e:"Dos et bassin plaqués contre le dossier, pieds à largeur de hanches au milieu du plateau. Descends jusqu'à ce que les genoux atteignent environ 90°, sans que le bas du dos décolle, puis pousse sans verrouiller violemment les genoux.",
  err:["Descendre si bas que le bassin s'enroule et décolle du dossier.","Tendre les jambes d'un coup sec en fin de poussée."],
  p:"Attention, la charge affichée n'a rien de comparable d'une machine à l'autre. C'est exactement pour ça que le programme raisonne en RPE et pas en kilos."},
 fe:{n:"Fentes haltères",m:"Quadriceps, fessiers",img:"Dumbbell_Lunges",pat:'eg',pat2:'fh',eq:2,ch:'kg',d:14,
  e:"Un haltère dans chaque main, buste droit. Avance d'un grand pas et descends jusqu'à ce que le genou arrière frôle le sol, puis repousse avec la jambe avant pour revenir. Alterne les jambes.",
  err:["Faire un pas trop court, ce qui projette le genou avant loin devant l'orteil.","Se pencher en avant à la remontée."],
  p:"Travail unilatéral : compte les répétitions par jambe. Utile pour corriger un déséquilibre gauche-droite que le squat masque."},

 rm:{n:"Soulevé de terre roumain",m:"Ischio-jambiers, fessiers",img:"Romanian_Deadlift",pat:'fh',pat2:'lo',eq:1,ch:'kg',d:70,
  e:"Départ debout, barre contre les cuisses, genoux légèrement fléchis et bloqués dans cette position. Recule les hanches vers l'arrière en laissant la barre glisser le long des jambes, dos plat. Descends jusqu'à sentir l'étirement des ischio-jambiers, en général à mi-tibia, puis reviens en poussant les hanches vers l'avant.",
  err:["Plier les genoux pendant la descente, ce qui en fait un soulevé de terre classique et retire la tension des ischio-jambiers.","Arrondir le bas du dos en cherchant à descendre plus bas que la souplesse ne le permet.","Éloigner la barre des jambes, ce qui multiplie la contrainte lombaire."],
  p:"Le repère n'est pas le sol mais l'étirement : arrête la descente là où le dos commencerait à s'arrondir. Ajoute 5 kg quand la série sort sous le RPE visé sans perte de position."},
 ht:{n:"Hip thrust barre",m:"Fessiers",img:"Barbell_Hip_Thrust",pat:'fh',pat2:'eg',eq:1,ch:'kg',d:60,
  e:"Haut du dos calé sur un banc, barre sur le pli de hanche avec un coussin, pieds à plat. Pousse le bassin vers le haut jusqu'à l'alignement épaules-hanches-genoux, marque une seconde en serrant les fessiers, puis redescends en contrôlant.",
  err:["Monter en hyperextension lombaire au lieu de s'arrêter à l'alignement.","Pieds trop loin, ce qui transfère le travail sur les ischio-jambiers."],
  p:"La pause en haut compte plus que la charge. Une seconde pleine à chaque répétition avant d'envisager d'ajouter des disques."},

 el:{n:"Élévations latérales",m:"Épaules, faisceau moyen",img:"Side_Lateral_Raise",pat:'ep',pat2:'tra',eq:2,ch:'kg',d:8,
  e:"Debout, haltères le long du corps, coudes très légèrement fléchis. Monte les bras sur les côtés jusqu'à la hauteur des épaules, en menant le mouvement avec les coudes plutôt qu'avec les mains. Redescends lentement, sur environ deux secondes.",
  err:["Prendre trop lourd et lancer la charge avec un mouvement de buste.","Monter au-dessus de la ligne des épaules, ce qui transfère le travail sur les trapèzes.","Laisser tomber les bras sans contrôle."],
  p:"Ici la charge compte peu et l'échelle d'effort compte beaucoup. Cherche à ajouter des répétitions à charge égale avant de monter d'un cran d'haltère."},
 fp:{n:"Face pull",m:"Arrière d'épaule, rotateurs",img:"Face_Pull",pat:'re',pat2:'tra',eq:0,ch:'kg',d:25,
  e:"Poulie réglée à hauteur du visage, corde en prise neutre. Tire vers le front en écartant les mains, coudes hauts et dans l'axe des épaules. Termine en rotation externe, mains au-dessus des coudes, puis reviens en contrôlant.",
  err:["Tirer trop bas, vers la poitrine, ce qui en fait un tirage de dos.","Laisser les coudes tomber sous la ligne des épaules.","Charger lourd et perdre la rotation externe, qui est tout l'intérêt du mouvement."],
  p:"Mouvement de santé d'épaule, à garder autour de RPE 7 même en fin de cycle. Ce n'est pas un exercice sur lequel on cherche la limite."},
 cu:{n:"Curl haltères incliné",m:"Biceps",img:"Incline_Dumbbell_Curl",pat:'fc',pat2:'avb',eq:2,ch:'kg',d:12,
  e:"Banc incliné à 45°, bras pendants derrière la ligne du corps. Monte l'haltère sans avancer le coude, en tournant légèrement le poignet vers l'extérieur en fin de montée. Redescends jusqu'aux bras complètement tendus.",
  err:["Avancer les coudes pour finir la répétition, ce qui retire la tension du biceps.","Écourter la descente et perdre l'étirement, qui est tout l'intérêt de la position inclinée.","Décoller le dos du banc pour lancer la charge."],
  p:"Ajoute 1 kg seulement quand les trois séries passent sous le RPE visé sans que les coudes avancent. Si tu stagnes, ralentis la descente à trois secondes avant d'envisager plus lourd : le biceps répond mieux au temps sous tension qu'à la charge."},
 tri:{n:"Extensions à la poulie",m:"Triceps",img:"Triceps_Pushdown",pat:'ec',eq:0,ch:'kg',d:25,
  e:"Debout face à la poulie haute, coudes collés au buste et fixes. Étends les bras jusqu'au verrouillage complet, marque un temps, puis remonte en contrôlant sans laisser les coudes s'ouvrir.",
  err:["Pencher le buste en avant pour pousser avec le poids du corps.","Laisser les coudes reculer pendant la montée.","Ne pas verrouiller les bras en bas, là où le triceps travaille le plus.","Remonter en laissant la poulie tirer, ce qui supprime toute la phase de retour."],
  p:"Monte d'un cran de poulie quand la dernière série reste sous le RPE visé avec les coudes immobiles. Garde en tête que le triceps représente les deux tiers du volume du bras : si ce sont tes bras que tu veux développer, c'est ici que ça se joue, plus qu'au curl."},

 gai:{n:"Gainage ventral",m:"Abdominaux, lombaires",img:"Plank",pat:'ae',pat2:'ft',eq:3,ch:'temps',d:45,
  e:"Appui sur les avant-bras et la pointe des pieds, coudes sous les épaules. Rentre le bassin pour effacer la cambrure, serre les fessiers, et garde une ligne droite des épaules aux talons. Respire normalement.",
  err:["Bassin trop haut, ce qui transforme la position en repos.","Bas du dos creusé, qui déplace la contrainte sur les lombaires.","Tenir en apnée au lieu de respirer normalement.","Chercher la performance en tenant trois minutes : au-delà d'une minute propre, on entraîne l'endurance de position, plus le gainage."],
  p:"Les abdominaux ne se programment pas comme un développé couché : ton squat et ton soulevé de terre les sollicitent déjà lourdement. Ici on ajoute juste ce qui manque. Passe à 60 secondes quand le bassin ne bouge plus."},
 rj:{n:"Relevés de jambes suspendu",m:"Abdominaux, fléchisseurs",img:"Hanging_Leg_Raise",pat:'ft',pat2:'ae',eq:3,ch:'aucune',d:10,
  e:"Suspendu à la barre, épaules abaissées et actives. Enroule le bassin vers le haut avant de monter les jambes, comme si tu voulais rapprocher le pubis du sternum. Redescends lentement sans laisser le corps se balancer.",
  err:["Monter les jambes sans enrouler le bassin, ce qui ne travaille que les fléchisseurs de hanche.","Se balancer pour lancer la montée.","Descendre en chute libre, ce qui cambre le bas du dos."],
  p:"Genoux pliés d'abord. Passe aux jambes tendues quand trois séries sortent sans balancement, avant d'ajouter des répétitions."},
 lom:{n:"Extensions lombaires au banc",m:"Lombaires, fessiers",img:"Hyperextensions_Back_Extensions",pat:'lo',pat2:'fh',eq:3,ch:'lest',d:0,
  e:"Bassin calé sur le support, pieds bloqués, buste libre. Descends en contrôlant jusqu'à ce que le buste soit à la verticale, dos neutre, puis remonte en serrant les fessiers jusqu'à l'alignement avec les jambes, sans aller au-delà.",
  err:["Monter en hyperextension au-delà de l'alignement, ce qui comprime les lombaires.","Arrondir le dos à la descente au lieu de plier depuis la hanche.","Prendre de l'élan à chaque répétition."],
  p:"Souvent le grand oublié chez ceux qui stagnent au soulevé de terre. Au poids du corps d'abord, puis un disque de 5 kg contre la poitrine."},

 ram:{n:"Rameur, intervalles",m:"Cardio, chaîne postérieure",img:"Rowing_Stationary",pat:'ca',eq:0,ch:'dist',d:250,
  e:"Départ jambes fléchies, bras tendus, dos droit. Pousse d'abord avec les jambes, puis bascule le buste vers l'arrière, et seulement à la fin tire avec les bras. Le retour se fait dans l'ordre inverse : bras, buste, jambes.",
  err:["Tirer avec les bras en premier, ce qui épuise le haut du corps sans produire de puissance.","Arrondir le dos en fin de retour, la faute la plus coûteuse pour les lombaires.","Partir trop fort sur le premier intervalle et s'effondrer sur les suivants.","Régler la résistance au maximum en croyant travailler plus dur : un réglage entre 3 et 5 correspond à l'aviron réel et fatigue beaucoup moins le dos."],
  p:"Note ton temps sur le premier intervalle et vise le même sur les sept suivants. Si le huitième est plus lent de plus de cinq secondes, tu étais parti trop vite. La régularité est le seul indicateur qui compte ici, et c'est aussi ce qui empêche cette séance de venir manger tes séances de jambes."},
 hip:{n:"Étirement des fléchisseurs de hanche",m:"Hanches, psoas",img:"Kneeling_Hip_Flexor",pat:'mo',eq:3,ch:'temps',d:45,
  e:"Genou au sol, l'autre pied devant à 90°. Rentre le bassin sous toi plutôt que de te pencher en avant, puis avance légèrement le poids du corps jusqu'à sentir l'étirement devant la cuisse arrière. Serre le fessier du côté étiré.",
  err:["Se pencher en avant et cambrer le dos, ce qui annule complètement l'étirement.","Ne pas serrer le fessier du côté étiré, alors que c'est lui qui ouvre réellement la hanche.","Forcer par à-coups au lieu de tenir la position en respirant.","Poser le genou à même le sol dur, ce qui fait écourter la tenue par inconfort plutôt que par manque de souplesse."],
  p:"À faire de préférence le lendemain d'une séance de jambes ou de ta pratique sportive, quand les hanches sont fermées. Aucune notion d'effort ici, on tient et on respire. C'est souvent ce qui manque à ceux qui n'arrivent pas à descendre au parallèle en squat : le blocage est devant la hanche, pas derrière."},
 tho:{n:"Étirement du chat",m:"Haut du dos, mobilité",img:"Cat_Stretch",pat:'mo',eq:3,ch:'aucune',d:10,
  e:"À quatre pattes, mains sous les épaules et genoux sous les hanches. Enroule le dos vers le plafond en rentrant le menton et le bassin, vertèbre par vertèbre, puis inverse en creusant le haut du dos et en ouvrant la poitrine. Le mouvement doit partir du haut du dos, pas des lombaires.",
  err:["Aller vite et transformer l'exercice en balancement, alors que l'amplitude vient du temps passé en fin de course.","Creuser uniquement le bas du dos, ce qui laisse le haut du dos aussi raide qu'avant.","Bloquer la respiration au lieu de souffler sur l'enroulement.","Écarter les mains au-delà de la largeur des épaules, ce qui déplace le travail sur les épaules."],
  p:"Deux séries de dix allers-retours, lentement, en marquant une seconde dans chaque position extrême. C'est le mouvement qui débloque le plus souvent le développé militaire : quand le haut du dos ne s'étend pas, l'épaule compense et la barre part vers l'avant."},
 dci:{n:"Développé incliné barre",m:"Haut des pectoraux, épaules",img:"Barbell_Incline_Bench_Press_-_Medium_Grip",pat:'ph',pat2:'ec',eq:1,ch:'kg',d:45,cap:8,
  e:"Banc incliné entre 30 et 45°, pas davantage sous peine de transformer le mouvement en développé épaules. Descends la barre haut sur la poitrine, juste sous les clavicules, puis pousse à la verticale.",
  err:["Incliner le banc à 60° ou plus, ce qui bascule tout le travail sur les épaules.","Descendre la barre trop bas, au niveau du sternum, ce qui casse la trajectoire.","Décoller les épaules du banc en fin de série."],
  p:"Attends-toi à environ 70 % de ta charge au développé couché à plat. Plafonné à RPE 8 sans pareur, comme tous les mouvements sous une barre."},
 dhi:{n:"Développé incliné haltères",m:"Haut des pectoraux, épaules",img:"Incline_Dumbbell_Press",pat:'ph',pat2:'ec',eq:2,ch:'kg',d:18,
  e:"Banc à 30°, haltères à hauteur de poitrine, coudes à 45° du buste. Pousse en rapprochant légèrement les haltères, sans les cogner, puis redescends jusqu'à sentir l'étirement.",
  err:["Écarter les coudes en croix, ce qui met l'épaule en position vulnérable.","Cogner les haltères en haut, ce qui relâche la tension.","Se cambrer pour aider à la poussée."],
  p:"La descente peut aller plus bas qu'à la barre : c'est tout l'intérêt. Cherche l'amplitude avant les kilos."},
 ecart:{n:"Écarté à la poulie",m:"Pectoraux",img:"Cable_Crossover",pat:'ph',eq:0,ch:'kg',d:15,
  e:"Debout entre deux poulies hautes, buste légèrement penché en avant, coudes fixes et à peine fléchis. Rapproche les mains devant toi en pensant à serrer les pectoraux, puis reviens en contrôlant jusqu'à l'étirement.",
  err:["Plier les coudes pendant le mouvement, ce qui en fait une poussée déguisée.","Charger lourd et compenser avec tout le corps.","Écourter le retour et perdre la mise en tension."],
  p:"Mouvement d'isolation : la charge compte peu, la sensation compte beaucoup. Reste léger et cherche des répétitions propres."},
 arn:{n:"Développé Arnold",m:"Épaules, faisceaux antérieur et moyen",img:"Arnold_Dumbbell_Press",pat:'pv',pat2:'ec',eq:2,ch:'kg',d:12,
  e:"Assis, haltères devant le visage paumes vers toi. Pousse en faisant pivoter les poignets vers l'extérieur, jusqu'à finir bras tendus paumes vers l'avant. Reviens en inversant la rotation.",
  err:["Tourner les poignets trop tôt, ce qui supprime l'intérêt du mouvement.","Prendre trop lourd et perdre la rotation.","Cambrer le bas du dos en fin de série."],
  p:"La rotation est le mouvement, pas un détail. Charge nettement moins qu'au développé épaules classique."},
 trs:{n:"Tractions supination",m:"Dos, biceps",img:"Chin-Up",pat:'tv',pat2:'fc',eq:3,ch:'lest',d:5,
  e:"Paumes vers toi, mains à largeur d'épaules. Abaisse les épaules puis tire jusqu'à ce que le menton dépasse la barre, en gardant les coudes proches du corps. Redescends bras tendus.",
  err:["Se balancer pour lancer la montée.","S'arrêter avant le menton, ce qui supprime la partie la plus dure.","Négliger la descente."],
  p:"Plus faciles que la pronation grâce à l'apport des biceps. Bon repli quand les tractions classiques ne sortent plus."},
 tpn:{n:"Tirage poulie prise serrée",m:"Dos, biceps",img:"V-Bar_Pulldown",pat:'tv',pat2:'fc',eq:0,ch:'kg',d:50,
  e:"Poignée en V, prise neutre, cuisses bloquées. Abaisse les épaules puis tire la poignée vers le haut de l'abdomen, coudes le long du corps. Remonte en contrôlant jusqu'à l'étirement complet.",
  err:["Se pencher en arrière pour tirer plus lourd.","Tirer avec les bras sans engager le dos.","Remonter en laissant la charge tirer."],
  p:"La prise neutre ménage l'épaule et le coude : à privilégier si tu as signalé une gêne."},
 tps:{n:"Tirage horizontal à la poulie",m:"Dos, arrière d'épaule",img:"Seated_Cable_Rows",pat:'th',pat2:'fc',eq:0,ch:'kg',d:45,
  e:"Assis, genoux légèrement fléchis, dos droit. Tire la poignée vers le nombril en serrant les omoplates, sans reculer le buste, puis reviens bras tendus en gardant le dos plat.",
  err:["Balancer le buste d'avant en arrière pour tirer.","Arrondir le dos au retour.","Hausser les épaules pendant la traction."],
  p:"Bien plus tolérant pour le bas du dos que le rowing barre, à charge égale. Ajoute un cran quand la pause en fin de traction reste tenue."},
 rw2:{n:"Rowing deux haltères",m:"Dos, arrière d'épaule",img:"Bent_Over_Two-Dumbbell_Row",pat:'th',pat2:'fc',eq:2,ch:'kg',d:20,
  e:"Buste penché à 45°, dos plat, un haltère dans chaque main. Tire les deux vers les hanches en amenant les coudes vers l'arrière, puis redescends jusqu'aux bras tendus sans relever le buste.",
  err:["Se redresser au fil des répétitions.","Tirer vers les épaules plutôt que vers les hanches.","Arrondir le haut du dos."],
  p:"Exige plus de gainage que la version un bras. Si le bas du dos fatigue avant le dos, passe au rowing un bras."},
 fb:{n:"Fentes barre",m:"Quadriceps, fessiers",img:"Barbell_Lunge",pat:'eg',pat2:'fh',eq:1,ch:'kg',d:30,
  e:"Barre sur les trapèzes, buste droit. Avance d'un grand pas et descends jusqu'à ce que le genou arrière frôle le sol, puis repousse avec la jambe avant. Alterne les côtés.",
  err:["Faire un pas trop court, ce qui projette le genou avant devant les orteils.","Pencher le buste vers l'avant à la remontée.","Poser le pied trop en dedans, ce qui déséquilibre."],
  p:"Compte les répétitions par jambe. Excellent révélateur d'un déséquilibre gauche-droite que le squat masque complètement."},
 lext:{n:"Leg extension",m:"Quadriceps",img:"Leg_Extensions",pat:'eg',eq:0,ch:'kg',d:40,
  e:"Assis, dos plaqué au dossier, axe de la machine aligné avec le genou. Tends les jambes jusqu'au verrouillage, marque un temps, puis redescends lentement sans laisser la charge retomber.",
  err:["Régler l'axe trop haut ou trop bas, ce qui tire sur le genou.","Prendre de l'élan avec le bassin.","Lâcher la descente."],
  p:"Isolation pure : reste léger et cherche la tenue en haut. Utile pour terminer une séance de jambes sans charger la colonne."},
 sqf:{n:"Squat avant",m:"Quadriceps, gainage",img:"Front_Barbell_Squat",pat:'eg',pat2:'fh',eq:1,ch:'kg',d:50,
  e:"Barre posée sur le haut des épaules, coudes très hauts et pointés vers l'avant. Descends en gardant le buste le plus vertical possible, puis remonte en poussant le sol.",
  err:["Laisser tomber les coudes, ce qui fait basculer la barre vers l'avant.","Se pencher en avant comme sur un squat classique.","Charger comme au squat arrière : compte environ 75 % de celui-ci."],
  p:"Beaucoup plus exigeant pour le gainage et la mobilité de poignet. À privilégier si tu as une gêne lombaire au squat classique."},
 lc:{n:"Leg curl allongé",m:"Ischio-jambiers",img:"Lying_Leg_Curls",pat:'fh',eq:0,ch:'kg',d:30,
  e:"Allongé sur le ventre, rouleau juste au-dessus des talons, hanches plaquées. Fléchis les genoux jusqu'à amener les talons vers les fessiers, marque un temps, puis redescends lentement.",
  err:["Décoller les hanches pour aider, ce qui cambre le dos.","Écourter l'amplitude en haut.","Descendre en chute libre."],
  p:"Complète le soulevé roumain : l'un travaille la hanche, l'autre le genou. Les deux sont nécessaires pour des ischio-jambiers complets."},
 gm:{n:"Good morning",m:"Ischio-jambiers, lombaires",img:"Good_Morning",pat:'fh',pat2:'lo',eq:1,ch:'kg',d:30,
  e:"Barre sur les trapèzes, genoux légèrement fléchis et bloqués. Recule les hanches en penchant le buste vers l'avant, dos plat, jusqu'à l'horizontale environ, puis reviens en poussant les hanches vers l'avant.",
  err:["Arrondir le dos, qui est ici la faute la plus dangereuse.","Charger lourd : ce mouvement se travaille léger.","Plier les genoux pendant la descente."],
  p:"Reste très léger, autour de 30 % de ton soulevé roumain. C'est un mouvement de renforcement, pas de performance."},
 sdt:{n:"Soulevé de terre",m:"Chaîne postérieure complète",img:"Barbell_Deadlift",pat:'fh',pat2:'lo',eq:1,ch:'kg',d:80,cap:8,
  e:"Barre au-dessus du milieu du pied, tibias presque au contact. Prends la barre bras tendus, poitrine haute et dos plat, puis pousse le sol avec les jambes en gardant la barre collée aux jambes jusqu'au verrouillage des hanches.",
  err:["Tirer avec le dos avant que les jambes n'aient poussé.","Laisser la barre s'éloigner des tibias.","Hyperextension du dos en fin de mouvement."],
  p:"Le mouvement le plus coûteux en récupération du programme. Plafonné à RPE 8 : une répétition à l'échec au soulevé de terre est le meilleur moyen de perdre trois semaines."},
 elf:{n:"Élévations frontales",m:"Épaules, faisceau antérieur",img:"Front_Dumbbell_Raise",pat:'ep',pat2:'pv',eq:2,ch:'kg',d:8,
  e:"Debout, haltères devant les cuisses. Monte un bras tendu devant toi jusqu'à hauteur d'épaule, sans dépasser, puis redescends en contrôlant. Alterne.",
  err:["Se cambrer et balancer le buste pour lancer la charge.","Monter au-dessus de l'épaule, ce qui n'ajoute rien.","Prendre trop lourd sur un mouvement d'isolation."],
  p:"Le faisceau antérieur est déjà lourdement sollicité par toutes les poussées. N'en ajoute que si tes épaules sont une priorité déclarée."},
 rmf:{n:"Oiseau à la machine",m:"Arrière d'épaule",img:"Reverse_Machine_Flyes",pat:'re',pat2:'tra',eq:0,ch:'kg',d:20,
  e:"Assis face au dossier, poitrine appuyée, bras tendus devant. Écarte les bras vers l'arrière en menant avec les coudes, serre une seconde, puis reviens en contrôlant.",
  err:["Plier les coudes et transformer le mouvement en tirage.","Charger lourd et compenser avec les trapèzes.","Décoller la poitrine du dossier."],
  p:"L'arrière d'épaule est le groupe le plus souvent négligé, et celui qui équilibre toutes tes poussées. Volume élevé, charge faible."},
 rot:{n:"Rotation externe haltère",m:"Coiffe des rotateurs",img:"External_Rotation",pat:'re',eq:2,ch:'kg',d:4,
  e:"Allongé sur le côté, coude collé à la hanche et fléchi à 90°. Fais pivoter l'avant-bras vers le plafond sans décoller le coude, puis redescends lentement.",
  err:["Décoller le coude du corps, ce qui fait travailler autre chose.","Prendre plus de quelques kilos : ce muscle est minuscule.","Aller vite au lieu de contrôler."],
  p:"Mouvement de santé d'épaule, à garder autour de RPE 6. Deux à trois kilos suffisent, et c'est normal."},
 curlb:{n:"Curl barre",m:"Biceps",img:"Barbell_Curl",pat:'fc',pat2:'avb',eq:1,ch:'kg',d:25,
  e:"Debout, barre en supination à largeur d'épaules, coudes collés au buste. Monte la barre sans avancer les coudes ni reculer le buste, puis redescends jusqu'aux bras tendus.",
  err:["Balancer le buste pour lancer la montée, la faute la plus répandue en salle.","Avancer les coudes en fin de montée.","Ne pas tendre complètement les bras en bas."],
  p:"Si tu dois te balancer pour finir, c'est trop lourd. Une barre EZ soulage les poignets si tu as une gêne."},
 mart:{n:"Curl marteau",m:"Biceps, brachial",img:"Alternate_Hammer_Curl",pat:'fc',pat2:'avb',eq:2,ch:'kg',d:12,
  e:"Debout, haltères en prise neutre, pouces vers le haut. Monte sans tourner le poignet et sans avancer le coude, puis redescends bras tendus. Alterne les bras.",
  err:["Tourner le poignet, ce qui en fait un curl classique.","Balancer les haltères.","Écourter la descente."],
  p:"Travaille le brachial, sous le biceps, qui pousse ce dernier vers le haut et épaissit le bras. Complémentaire du curl classique, pas redondant."},
 pup:{n:"Curl au pupitre",m:"Biceps",img:"Preacher_Curl",pat:'fc',pat2:'avb',eq:1,ch:'kg',d:20,
  e:"Aisselles calées sur le pupitre, bras à plat sur le support. Monte la barre jusqu'à mi-course, puis redescends lentement jusqu'aux bras presque tendus, sans verrouiller brutalement.",
  err:["Tendre les bras d'un coup en bas, ce qui met le coude en danger.","Décoller les aisselles du pupitre.","Monter trop haut, là où la tension disparaît."],
  p:"Le pupitre supprime toute triche : c'est son intérêt et sa difficulté. Charge nettement moins qu'au curl debout."},
 dipt:{n:"Dips prise serrée",m:"Triceps",img:"Dips_-_Triceps_Version",pat:'ec',pat2:'ph',eq:3,ch:'lest',d:0,
  e:"Barres parallèles, buste le plus vertical possible et coudes serrés le long du corps. Descends jusqu'à ce que l'épaule arrive au niveau du coude, puis remonte en tendant complètement les bras.",
  err:["Pencher le buste en avant, ce qui déplace le travail sur les pectoraux.","Descendre trop bas.","Ne pas verrouiller les bras en haut."],
  p:"Le mouvement de triceps le plus productif à poids de corps. Ajoute du lest quand trois séries de dix sortent proprement."},
 nuq:{n:"Extension nuque à la corde",m:"Triceps, chef long",img:"Cable_Rope_Overhead_Triceps_Extension",pat:'ec',eq:0,ch:'kg',d:20,
  e:"Dos à la poulie, corde derrière la tête, coudes hauts et pointés vers l'avant. Tends les bras vers le haut sans bouger les coudes, puis reviens en contrôlant jusqu'à l'étirement.",
  err:["Laisser les coudes s'écarter vers l'extérieur.","Se pencher trop en avant, ce qui déplace la charge.","Écourter l'étirement en bas, qui est tout l'intérêt de la position."],
  p:"La seule position qui étire vraiment le chef long du triceps, celui qui donne l'épaisseur au bras. À préférer aux extensions poulie basse si tu cherches du volume."},
 bdips:{n:"Dips sur banc",m:"Triceps",img:"Bench_Dips",pat:'ec',pat2:'ph',eq:3,ch:'aucune',d:12,
  e:"Mains sur le bord d'un banc derrière toi, jambes tendues devant. Descends en pliant les coudes vers l'arrière jusqu'à 90°, puis remonte en tendant les bras.",
  err:["Descendre trop bas, ce qui met l'épaule en rotation interne extrême.","Écarter les coudes.","Aider avec les jambes en poussant sur les talons."],
  p:"Le repli quand aucune barre parallèle n'est disponible. Surélève les pieds sur un second banc pour durcir."},
 plat:{n:"Gainage latéral",m:"Obliques, stabilisateurs",img:"Side_Bridge",pat:'ae',pat2:'ft',eq:3,ch:'temps',d:30,
  e:"Sur le côté, en appui sur l'avant-bras, coude sous l'épaule, pieds superposés. Décolle les hanches jusqu'à former une ligne droite des chevilles aux épaules, et tiens en respirant.",
  err:["Laisser le bassin descendre progressivement.","Basculer le buste vers l'avant.","Tenir en apnée."],
  p:"Complète le gainage ventral en travaillant la résistance à l'inclinaison. Trente secondes par côté suffisent, avant d'envisager plus long."},
 crp:{n:"Crunch à la poulie",m:"Abdominaux",img:"Cable_Crunch",pat:'ft',pat2:'ae',eq:0,ch:'kg',d:25,
  e:"À genoux dos à la poulie haute, corde tenue près du visage. Enroule la colonne vers le bas en rapprochant les côtes du bassin, sans plier les hanches, puis remonte en contrôlant.",
  err:["Plier depuis les hanches au lieu d'enrouler le dos.","Tirer avec les bras.","Utiliser l'élan pour remonter."],
  p:"Le seul exercice d'abdominaux où l'on peut réellement ajouter de la charge, donc appliquer une surcharge progressive. Précieux à ce titre."},
 cr:{n:"Crunch au sol",m:"Abdominaux",img:"Crunches",pat:'ft',eq:3,ch:'aucune',d:15,
  e:"Allongé, genoux fléchis, mains sur les tempes sans tirer sur la nuque. Décolle les omoplates en enroulant le haut du dos, souffle en montant, puis redescends sans poser complètement la tête.",
  err:["Tirer sur la nuque avec les mains.","Monter le buste entier, ce qui fait travailler les fléchisseurs de hanche.","Aller vite et rebondir au sol."],
  p:"Passe à une amplitude plus lente plutôt qu'à plus de répétitions. Au-delà de vingt-cinq, ajoute une charge sur la poitrine."},
 sup:{n:"Superman",m:"Lombaires, fessiers",img:"Superman",pat:'lo',pat2:'fh',eq:3,ch:'temps',d:20,
  e:"À plat ventre, bras tendus devant. Décolle simultanément la poitrine et les cuisses du sol en serrant les fessiers, tiens quelques secondes, puis redescends en contrôlant.",
  err:["Monter en cassant la nuque vers l'arrière.","Décoller uniquement les bras.","Tenir en apnée."],
  p:"Le renforcement lombaire accessible partout, sans banc ni charge. Utile en début de cycle avant de passer aux extensions au banc."},
 corde:{n:"Corde à sauter",m:"Cardio, mollets",img:"Rope_Jumping",pat:'ca',eq:3,ch:'temps',d:60,
  e:"Coudes près du corps, la rotation vient des poignets et non des épaules. Sauts bas, quelques centimètres seulement, en amortissant sur l'avant du pied.",
  err:["Sauter trop haut, ce qui épuise inutilement.","Faire tourner la corde avec les bras entiers.","Retomber talons au sol."],
  p:"Le cardio le plus dense en temps, mais exigeant pour les mollets et les tendons d'Achille. Commence par des blocs de trente secondes."},
 enf:{n:"Posture de l'enfant",m:"Dos, hanches",img:"Childs_Pose",pat:'mo',eq:3,ch:'temps',d:60,
  e:"À genoux, fesses vers les talons, bras tendus loin devant, front vers le sol. Relâche les épaules et respire lentement en laissant la cage thoracique s'ouvrir à chaque inspiration.",
  err:["Forcer sur les épaules au lieu de laisser le poids descendre.","Retenir sa respiration.","Décoller les fesses des talons."],
  p:"À placer en fin de séance ou le lendemain. Aucun effort visé, seulement du temps passé en position."},
 mol:{n:"Mollets debout",m:"Mollets, gastrocnémiens",img:"Standing_Calf_Raises",pat:'mol',eq:0,ch:'kg',d:60,
  e:"Pointes de pieds sur la marche de la machine, talons dans le vide. Descends les talons le plus bas possible jusqu'à sentir l'étirement, marque un temps, puis monte sur la pointe des pieds en marquant aussi une pause en haut.",
  err:["Rebondir en bas sans marquer l'étirement, ce qui fait travailler le tendon plutôt que le muscle.","Écourter la montée et ne jamais atteindre l'extension complète.","Plier les genoux, ce qui déplace le travail sur le soléaire."],
  p:"Le mollet répond au temps sous tension plus qu'à la charge. Une seconde d'arrêt en bas et en haut vaut mieux que dix kilos de plus."},
 molA:{n:"Mollets assis",m:"Soléaire",img:"Seated_Calf_Raise",pat:'mol',eq:0,ch:'kg',d:40,
  e:"Assis, genoux fléchis à 90° sous le coussin, pointes de pieds sur la marche. Descends les talons, puis pousse sur la pointe des pieds sans décoller les cuisses du coussin.",
  err:["Aider avec les mains en poussant sur le coussin.","Aller vite et perdre l'amplitude.","Négliger l'étirement en bas."],
  p:"Genou fléchi, c'est le soléaire qui travaille, sous le gastrocnémien. Complémentaire de la version debout, pas redondant."},
 molP:{n:"Mollets au poids du corps",m:"Mollets",img:"Rocking_Standing_Calf_Raise",pat:'mol',eq:3,ch:'aucune',d:20,
  e:"Debout sur une marche, avant-pieds en appui, talons dans le vide. Descends lentement puis monte sur la pointe, une jambe à la fois si c'est trop facile.",
  err:["Se tenir fermement et soulager le poids du corps avec les bras.","Enchaîner sans contrôle.","Rester en amplitude réduite."],
  p:"Passe à une seule jambe quand vingt répétitions sortent facilement, plutôt que d'en ajouter davantage."},
 shr:{n:"Shrugs barre",m:"Trapèzes supérieurs",img:"Barbell_Shrug",pat:'tra',eq:1,ch:'kg',d:60,
  e:"Debout, barre à bout de bras devant les cuisses, bras tendus et relâchés. Monte les épaules vers les oreilles à la verticale, marque un temps en haut, puis redescends en contrôlant.",
  err:["Faire des rotations d'épaules, inutiles et contraignantes pour l'articulation.","Plier les bras pour aider.","Écourter la descente et perdre l'étirement."],
  p:"Le trapèze supporte des charges lourdes mais réclame de l'amplitude. Si tu ne montes plus les épaules franchement, c'est trop lourd."},
 shrH:{n:"Shrugs haltères",m:"Trapèzes supérieurs",img:"Dumbbell_Shrug",pat:'tra',eq:2,ch:'kg',d:24,
  e:"Un haltère dans chaque main le long du corps, bras tendus. Monte les épaules à la verticale, pause d'une seconde, puis redescends lentement.",
  err:["Pencher la tête en avant pendant la montée.","Utiliser l'élan des jambes.","Ne pas marquer la pause en haut."],
  p:"Les haltères permettent une amplitude plus libre que la barre, qui bute contre les cuisses. Bon choix si tu ressens une gêne au poignet."},
 tir:{n:"Rowing menton",m:"Trapèzes, épaules",img:"Upright_Barbell_Row",pat:'tra',pat2:'ep',eq:1,ch:'kg',d:30,
  e:"Barre devant les cuisses, prise largeur d'épaules. Tire la barre vers le haut le long du corps en menant avec les coudes, jusqu'à hauteur de poitrine, puis redescends en contrôlant.",
  err:["Monter au-dessus de la poitrine, ce qui pince l'épaule.","Prendre une prise trop serrée, qui aggrave cette contrainte.","Balancer le buste pour lancer la barre."],
  p:"Mouvement à surveiller si tes épaules sont sensibles : arrête la montée à hauteur de poitrine et n'insiste pas si ça pince. Les shrugs sont une alternative plus sûre."},
 poi:{n:"Curl de poignets",m:"Avant-bras, fléchisseurs",img:"Palms-Up_Barbell_Wrist_Curl_Over_A_Bench",pat:'avb',eq:1,ch:'kg',d:15,
  e:"Assis, avant-bras posés sur les cuisses ou un banc, paumes vers le haut, poignets dans le vide. Laisse la barre rouler jusqu'au bout des doigts, puis referme la main et fléchis le poignet vers le haut.",
  err:["Décoller les avant-bras du support.","Négliger la phase où la barre roule dans les doigts, qui travaille la prise.","Charger lourd sur une articulation fragile."],
  p:"Séries longues, quinze à vingt répétitions. L'avant-bras est composé de petits muscles endurants qui ne répondent pas aux charges lourdes."},
 poiI:{n:"Curl de poignets inversé",m:"Avant-bras, extenseurs",img:"Palms-Down_Wrist_Curl_Over_A_Bench",pat:'avb',eq:1,ch:'kg',d:8,
  e:"Même position, mais paumes vers le bas. Laisse le poignet descendre, puis relève-le sans bouger l'avant-bras.",
  err:["Prendre la même charge qu'en supination : les extenseurs sont bien plus faibles.","Bouger le coude.","Aller vite."],
  p:"Souvent le remède aux douleurs de coude externe chez ceux qui tirent beaucoup. Très léger, très contrôlé."},
 ferm:{n:"Marche du fermier",m:"Avant-bras, gainage, trapèzes",img:"Farmers_Walk",pat:'avb',pat2:'tra',eq:2,ch:'kg',d:24,
  e:"Un haltère lourd dans chaque main, épaules basses et en arrière, buste droit. Marche à pas réguliers sur une distance donnée sans laisser les épaules s'affaisser.",
  err:["Pencher le buste en avant.","Faire de trop grands pas, ce qui déséquilibre.","Lâcher la prise avant d'avoir terminé la distance : mieux vaut moins lourd et plus loin."],
  p:"Travaille la prise, le gainage et les trapèzes en même temps. Excellent complément si ta prise lâche avant ton dos au soulevé de terre."},
 add:{n:"Adducteurs à la machine",m:"Adducteurs",img:"Thigh_Adductor",pat:'add',eq:0,ch:'kg',d:40,
  e:"Assis, cuisses écartées contre les coussins. Resserre les jambes en contrôlant, marque un temps, puis laisse revenir lentement sans laisser la charge claquer.",
  err:["Laisser la charge revenir en chute libre, ce qui étire brutalement l'aine.","Chercher une amplitude d'écartement excessive.","Aider avec les mains sur les coussins."],
  p:"Souvent moqué, souvent utile : les adducteurs se blessent fréquemment dans les sports de pivot. À garder léger et contrôlé."},
 sumo:{n:"Squat sumo haltère",m:"Adducteurs, fessiers",img:"Plie_Dumbbell_Squat",pat:'add',pat2:'eg',eq:2,ch:'kg',d:20,
  e:"Pieds très écartés, pointes vers l'extérieur, un haltère tenu à deux mains entre les jambes. Descends en gardant le buste vertical et les genoux dans l'axe des pieds, puis remonte en poussant le sol.",
  err:["Laisser les genoux rentrer vers l'intérieur.","Pencher le buste en avant.","Écarter les pieds au point de ne plus pouvoir descendre."],
  p:"Alternative aux adducteurs à la machine quand tu n'en as pas. Travaille aussi les fessiers, contrairement à la machine."},

 molh:{n:"Mollets debout haltères",m:"Mollets",img:"Standing_Dumbbell_Calf_Raise",pat:'mol',eq:2,ch:'kg',d:20,
  e:"Un haltère dans chaque main, bras le long du corps, l'avant des pieds sur une marche ou un disque et les talons dans le vide. Descends les talons aussi bas que la cheville le permet, marque un temps d'arrêt en bas, puis monte sur la pointe et tiens une seconde en haut.",
  err:["Rebondir en bas sans marquer l'étirement, ce qui fait travailler le tendon plutôt que le muscle.","Plier les genoux pour aider, ce qui transforme le mouvement en mini-squat."],
  p:"Le mollet répond au temps sous tension plus qu'à la charge. Vise 12 à 20 répétitions lentes avant de monter d'un cran d'haltère."},
 molp:{n:"Mollets à la presse",m:"Mollets",img:"Calf_Press_On_The_Leg_Press_Machine",pat:'mol',eq:0,ch:'kg',d:60,
  e:"Installé à la presse à cuisses, jambes presque tendues, place seulement l'avant des pieds en bas de la plateforme. Pousse avec la pointe des pieds en dépliant la cheville, puis laisse le poids redescendre le talon jusqu'à l'étirement.",
  err:["Garder la sécurité de la machine engagée, ce qui bloque l'amplitude.","Tendre complètement le genou et le verrouiller sous charge."],
  p:"C'est la variante qui permet le plus de charge sans exiger d'équilibre. Utile si tes mollets fatiguent avant tes pieds sur les versions debout."},
 mol1:{n:"Mollets sur une jambe",m:"Mollets",img:"Calf_Raise_On_A_Dumbbell",pat:'mol',eq:3,ch:'lest',d:0,
  e:"Debout sur une marche, l'avant d'un seul pied en appui, l'autre jambe relevée, une main au mur pour l'équilibre. Descends le talon le plus bas possible, puis monte sur la pointe et tiens une seconde.",
  err:["S'aider du bras en tirant sur le mur, ce qui enlève la moitié de la charge.","Écourter l'amplitude en bas parce que l'étirement tire."],
  p:"Le poids du corps sur une jambe suffit longtemps. Quand tu passes 20 répétitions propres, prends un haltère dans la main libre."},

 elp:{n:"Élévations latérales à la poulie",m:"Épaules, faisceau latéral",img:"Cable_Seated_Lateral_Raise",pat:'ep',eq:0,ch:'kg',d:5,
  e:"Poulie basse, poignée dans la main opposée, le câble passe devant les jambes. Monte le bras sur le côté jusqu'à l'horizontale, coude très légèrement fléchi, petit doigt un peu plus haut que le pouce. Contrôle la descente sans laisser le câble tirer.",
  err:["Monter au-dessus de l'horizontale, ce qui passe le travail sur le trapèze.","Donner une impulsion des jambes pour lancer le bras."],
  p:"Contrairement aux haltères, la poulie garde de la tension en bas du mouvement. Charge légère, séries longues : 12 à 20 répétitions."},
 scap:{n:"Élévations en Y",m:"Épaules, faisceau latéral et avant",img:"Dumbbell_Scaption",pat:'ep',pat2:'pv',eq:2,ch:'kg',d:4,
  e:"Debout, un haltère léger dans chaque main, paumes face à face. Monte les bras en diagonale, à environ 30° en avant du plan des épaules, jusqu'à hauteur d'épaule : les bras dessinent un Y. Descends lentement.",
  err:["Prendre trop lourd, ce qui fait hausser les épaules et supprime l'intérêt du mouvement.","Monter droit sur le côté, ce qui en fait une élévation latérale classique."],
  p:"Ce plan diagonal est le plus confortable pour l'épaule. C'est un bon premier exercice d'épaule si les élévations latérales pincent."},

 dbug:{n:"Dead bug",m:"Abdominaux profonds, gainage",img:"Dead_Bug",pat:'ae',pat2:'ft',eq:3,ch:'aucune',d:0,
  e:"Allongé sur le dos, bras tendus vers le plafond, genoux fléchis à la verticale des hanches. Colle le bas du dos au sol et garde-le collé. Descends lentement un bras et la jambe opposée vers le sol, sans toucher, puis reviens et alterne.",
  err:["Laisser le bas du dos se creuser dès que la jambe descend : c'est le signal d'arrêt, pas un détail.","Aller vite, alors que tout l'intérêt est dans la lenteur."],
  p:"Progresse en descendant plus bas et plus lentement, pas en ajoutant des répétitions. Si le dos décolle, tu es allé trop loin."},
 pal:{n:"Pallof press",m:"Gainage anti-rotation, obliques",img:"Pallof_Press",pat:'ae',pat2:'ft',eq:0,ch:'kg',d:10,
  e:"Debout de profil face à une poulie réglée à hauteur de poitrine, les deux mains sur la poignée contre le sternum, pieds écartés. Tends les bras devant toi et résiste à la rotation que le câble impose. Tiens deux secondes bras tendus, reviens.",
  err:["Laisser le buste pivoter vers la poulie, ce qui annule tout le travail.","Prendre lourd : au-delà d'un certain point on ne résiste plus, on compense avec les hanches."],
  p:"Progresse en t'éloignant de la poulie plutôt qu'en chargeant. C'est le meilleur exercice de gainage pour ceux qui trouvent la planche ennuyeuse."},

 rkp:{n:"Soulevé de terre partiel",m:"Lombaires, trapèzes, fessiers",img:"Rack_Pulls",pat:'lo',pat2:'fh',eq:1,ch:'kg',d:70,cap:8,
  e:"Barre posée sur les crochets d'une cage, à hauteur de genou. Prise à la largeur des épaules, dos à plat, poitrine ouverte. Tire en poussant les hanches vers l'avant jusqu'à te redresser complètement, puis repose la barre sur les crochets sans la laisser tomber.",
  err:["Arrondir le haut du dos au départ, ce qui met tout sur les disques.","Tirer avec les bras au lieu de pousser avec les hanches."],
  p:"L'amplitude réduite permet plus lourd qu'un soulevé complet : c'est l'intérêt, mais aussi le piège. Plafonné à RPE 8, la technique se dégrade vite sur cet exercice."},
 lomsol:{n:"Extensions lombaires au sol",m:"Lombaires, fessiers",img:"Hyperextensions_With_No_Hyperextension_Bench",pat:'lo',pat2:'fh',eq:3,ch:'aucune',d:0,
  e:"Allongé sur le ventre, mains près des tempes, pieds tenus ou calés. Décolle le buste en contractant le bas du dos et les fessiers, jusqu'à ce que la poitrine quitte le sol, puis redescends sans relâcher complètement.",
  err:["Monter le plus haut possible en cambrant, alors que quelques centimètres suffisent.","Tirer sur la nuque avec les mains."],
  p:"Aucun matériel nécessaire, c'est la version de repli du banc à lombaires. Quand 15 répétitions passent facilement, tiens deux secondes en haut de chaque répétition."},

 tirp:{n:"Rowing menton à la poulie",m:"Trapèzes, épaules",img:"Upright_Cable_Row",pat:'tra',pat2:'ep',eq:0,ch:'kg',d:20,
  e:"Poulie basse, barre courte en prise pronation largeur d'épaules. Tire les coudes vers le haut et l'extérieur, la barre longe le buste jusqu'à hauteur de poitrine. Les coudes restent toujours plus hauts que les mains. Redescends contrôlé.",
  err:["Tirer jusqu'au menton, ce qui met l'épaule en rotation interne extrême.","Prendre une prise trop serrée, qui accentue ce pincement."],
  p:"Arrête-toi à hauteur de poitrine, pas plus haut : c'est là que le rapport bénéfice/risque est bon. Si l'épaule pince quelque part, réduis l'amplitude avant de réduire la charge."},

 poih:{n:"Curl de poignets haltères",m:"Avant-bras, fléchisseurs",img:"Seated_Dumbbell_Palms-Up_Wrist_Curl",pat:'avb',eq:2,ch:'kg',d:6,
  e:"Assis, avant-bras posés sur les cuisses, paumes vers le haut, poignets dans le vide au-delà des genoux. Laisse les haltères rouler jusqu'au bout des doigts, puis referme la main et enroule le poignet vers le haut.",
  err:["Décoller l'avant-bras de la cuisse pour aider.","Amplitude minimale, alors que le passage par le bout des doigts est justement la partie utile."],
  p:"Charge légère et séries longues, 15 à 25 répétitions. L'avant-bras encaisse mieux le volume que la charge."},
 poiinv:{n:"Curl de poignets inversé haltères",m:"Avant-bras, extenseurs",img:"Palms-Down_Dumbbell_Wrist_Curl_Over_A_Bench",pat:'avb',eq:2,ch:'kg',d:4,
  e:"Avant-bras posés sur un banc ou les cuisses, paumes vers le sol, poignets dans le vide. Laisse la main descendre sous son poids, puis relève le dos de la main vers le plafond sans bouger l'avant-bras.",
  err:["Prendre la même charge que sur la version paumes en haut : les extenseurs sont bien plus faibles.","Bouger le coude pour compenser."],
  p:"C'est le côté que presque personne ne travaille, et celui qui protège le coude en cas de douleur à l'extérieur. Très léger, très propre, 15 à 20 répétitions."},

 addsol:{n:"Élévations de jambe au sol",m:"Adducteurs, hanche",img:"Side_Leg_Raises",pat:'add',eq:3,ch:'aucune',d:0,
  e:"Allongé sur le côté, jambe du dessous tendue, jambe du dessus fléchie et posée devant. Monte la jambe tendue du dessous vers le plafond en gardant le pied à plat, puis redescends sans poser complètement.",
  err:["Rouler le bassin en arrière pour gagner de l'amplitude.","Aller vite : le muscle est petit, le contrôle fait tout."],
  p:"Aucun matériel, utile pour rattraper un intérieur de cuisse faible. Quand 20 répétitions par côté passent, ajoute un élastique autour des chevilles."},
 sqlat:{n:"Squat latéral barre",m:"Adducteurs, quadriceps, fessiers",img:"Barbell_Side_Split_Squat",pat:'add',pat2:'eg',eq:1,ch:'kg',d:30,
  e:"Barre sur les trapèzes, pieds très écartés, pointes légèrement ouvertes. Transfère le poids sur une jambe en pliant ce genou, l'autre jambe reste tendue et son intérieur de cuisse s'étire. Reviens au centre et alterne.",
  err:["Laisser le genou fléchi partir vers l'intérieur.","Écarter les pieds au-delà de ce que ta souplesse permet, ce qui fait basculer le bassin."],
  p:"Commence à vide pour trouver l'écartement qui te convient. C'est un des rares exercices qui charge l'adducteur en position allongée, là où les blessures arrivent."},

 ois:{n:"Oiseau haltères",m:"Épaules arrière, trapèzes",img:"Reverse_Flyes",pat:'re',pat2:'tra',eq:2,ch:'kg',d:6,
  e:"Buste penché à 45° ou plus, dos à plat, un haltère léger dans chaque main bras pendants. Écarte les bras sur le côté en menant avec les coudes, jusqu'à ce que les mains arrivent à hauteur d'épaules. Serre les omoplates en haut, redescends lentement.",
  err:["Prendre trop lourd, ce qui transforme le mouvement en rowing.","Arrondir le dos, ce qui fatigue les lombaires avant l'épaule."],
  p:"L'arrière d'épaule est petit : 12 à 20 répétitions avec des haltères ridiculement légers font plus qu'une charge que tu dois lancer."},

 crinv:{n:"Crunch inversé",m:"Abdominaux, bas",img:"Reverse_Crunch",pat:'ft',eq:3,ch:'aucune',d:0,
  e:"Allongé sur le dos, mains le long du corps ou agrippées derrière la tête, genoux fléchis. Enroule le bassin vers la poitrine en décollant le bas du dos du sol, genoux vers le visage, puis redescends lentement sans laisser les pieds toucher.",
  err:["Balancer les jambes pour créer l'élan, ce qui fait travailler l'articulation de la hanche et pas l'abdominal.","Descendre en relâchant d'un coup."],
  p:"C'est l'enroulement du bassin qui compte, pas la hauteur des jambes. Ralentis la descente avant d'ajouter des répétitions."},
 russ:{n:"Russian twist",m:"Obliques, gainage en rotation",img:"Russian_Twist",pat:'ft',pat2:'ae',eq:3,ch:'aucune',d:0,
  e:"Assis, genoux fléchis, talons au sol ou légèrement décollés, buste incliné en arrière à 45°. Mains jointes devant la poitrine, tourne le buste d'un côté puis de l'autre en gardant l'inclinaison du dos constante.",
  err:["Bouger seulement les bras pendant que le buste reste fixe.","Arrondir le dos et s'affaisser, ce qui met la charge sur les lombaires."],
  p:"Garde le buste incliné du début à la fin : dès qu'il se redresse, l'exercice devient facile et inutile. Ensuite, un haltère léger dans les mains."},

 pont:{n:"Pont fessier au sol",m:"Fessiers, ischio-jambiers",img:"Butt_Lift_Bridge",pat:'fh',eq:3,ch:'aucune',d:0,
  e:"Allongé sur le dos, genoux fléchis, pieds à plat près des fesses, bras le long du corps. Pousse dans les talons et monte le bassin jusqu'à aligner genoux, hanches et épaules. Serre les fessiers en haut une seconde, redescends sans poser complètement.",
  err:["Monter en cambrant le bas du dos au lieu de serrer les fessiers, ce qui se sent tout de suite dans les lombaires.","Pieds trop loin, ce qui transfère le travail sur les ischio-jambiers."],
  p:"Point de départ sans matériel. Quand 20 répétitions ne coûtent rien, passe au pont sur une jambe, puis au hip thrust chargé."},
 pont1:{n:"Pont fessier une jambe",m:"Fessiers, ischio-jambiers",img:"Single_Leg_Glute_Bridge",pat:'fh',eq:3,ch:'aucune',d:0,
  e:"Même position que le pont fessier, mais une jambe tendue vers le plafond. Pousse dans le talon au sol et monte le bassin en gardant les deux hanches à la même hauteur. Serre le fessier en haut, redescends lentement.",
  err:["Laisser la hanche du côté libre s'affaisser, ce qui trahit un fessier qui ne tient pas encore.","Pousser sur la pointe du pied plutôt que sur le talon."],
  p:"Deux fois la charge du pont classique sans aucun matériel. Si le bassin penche, reviens sur deux jambes le temps que ça tienne."},
 kick:{n:"Kickback à la poulie",m:"Fessiers",img:"One-Legged_Cable_Kickback",pat:'fh',eq:0,ch:'kg',d:5,
  e:"Sangle à la cheville, poulie basse, face à la machine, mains en appui sur le châssis, buste légèrement penché. Pousse la jambe vers l'arrière en tendant la hanche, sans cambrer le bas du dos. Serre le fessier en fin de course, reviens contrôlé.",
  err:["Aller chercher l'amplitude en cambrant : le mouvement vient de la hanche, pas du dos.","Plier et tendre le genou, ce qui déplace le travail sur l'ischio."],
  p:"C'est un exercice d'isolation, pas un exercice de charge. Léger, 12 à 20 répétitions par jambe, en fin de séance après un mouvement lourd."},
 pth:{n:"Pull through à la poulie",m:"Fessiers, ischio-jambiers",img:"Pull_Through",pat:'fh',eq:0,ch:'kg',d:25,
  e:"Dos à une poulie basse, corde passée entre les jambes, mains tenant les extrémités. Recule de deux pas, puis pousse les hanches en arrière en gardant le dos plat jusqu'à sentir l'étirement des ischio-jambiers. Reviens en poussant le bassin vers l'avant, fessiers serrés.",
  err:["Tirer avec les bras au lieu de laisser les hanches faire tout le travail.","Terminer en cambrant le bas du dos au lieu de finir par une contraction du fessier."],
  p:"C'est la charnière de hanche la plus facile à apprendre : la poulie donne la direction, tu ne peux pas tricher longtemps. Bon apprentissage avant le soulevé de terre roumain."},

 bul:{n:"Fentes bulgares haltères",m:"Quadriceps, fessiers",img:"Split_Squat_with_Dumbbells",pat:'eg',pat2:'fh',eq:2,ch:'kg',d:12,
  e:"Un haltère dans chaque main, le dessus du pied arrière posé sur un banc, pied avant assez loin devant. Descends verticalement jusqu'à ce que la cuisse avant soit proche de l'horizontale, genou arrière vers le sol, puis remonte en poussant dans le talon avant.",
  err:["Pied avant trop près du banc, ce qui fait butter le genou en avant.","Chercher l'équilibre plutôt que la profondeur : commence à vide, une main au mur si besoin."],
  p:"Extrêmement efficace et extrêmement inconfortable, c'est normal. Deux répétitions gagnées valent mieux qu'un haltère de plus sur cet exercice."},
 mont:{n:"Montées sur banc haltères",m:"Quadriceps, fessiers",img:"Dumbbell_Step_Ups",pat:'eg',pat2:'fh',eq:2,ch:'kg',d:10,
  e:"Un haltère dans chaque main, face à un banc à hauteur de genou. Pose un pied entier dessus, puis monte en poussant uniquement avec cette jambe, sans prendre appui du pied resté au sol. Redescends lentement le même pied, contrôlé.",
  err:["Se propulser avec la jambe du bas, ce qui vide l'exercice de son intérêt.","Choisir une marche trop haute, ce qui oblige à s'aider du buste."],
  p:"La descente lente est la moitié du travail. Monte la hauteur de la marche avant de monter la charge, jusqu'à hauteur de genou environ."},
 sqpc:{n:"Squat au poids du corps",m:"Quadriceps, fessiers",img:"Bodyweight_Squat",pat:'eg',pat2:'fh',eq:3,ch:'aucune',d:0,
  e:"Pieds largeur de bassin, pointes légèrement ouvertes, bras devant pour l'équilibre. Pousse les hanches en arrière et descends aussi bas que le dos reste plat, genoux dans l'axe des pieds. Remonte en poussant dans tout le pied.",
  err:["Talons qui décollent : recule les hanches davantage ou écarte un peu plus les pieds.","Genoux qui rentrent vers l'intérieur en remontant."],
  p:"Sers-t'en pour construire l'amplitude avant de charger. Quand 20 répétitions profondes passent sans effort, passe au squat barre ou aux fentes bulgares."},
 fepc:{n:"Fentes marchées",m:"Quadriceps, fessiers",img:"Bodyweight_Walking_Lunge",pat:'eg',pat2:'fh',eq:3,ch:'aucune',d:0,
  e:"Debout, mains sur les hanches. Fais un grand pas en avant et descends jusqu'à ce que le genou arrière approche du sol, buste droit. Remonte en poussant dans la jambe avant et enchaîne directement le pas suivant avec l'autre jambe.",
  err:["Pas trop court, ce qui envoie le genou avant bien au-delà de la pointe du pied.","Buste penché en avant pour compenser un manque d'équilibre."],
  p:"Compte les répétitions par jambe, pas au total. Quand 12 par jambe passent proprement, prends un haltère dans chaque main."},

 bfront:{n:"Barre au front",m:"Triceps",img:"Lying_Triceps_Press",pat:'ec',eq:1,ch:'kg',d:20,
  e:"Allongé sur un banc, barre tenue bras tendus au-dessus des épaules, prise largeur d'épaules. Plie seulement les coudes pour descendre la barre vers le front ou juste au-dessus, coudes qui restent pointés vers le plafond. Remonte en tendant les bras.",
  err:["Laisser les coudes s'écarter et partir vers l'extérieur, ce qui fait perdre la tension sur le triceps.","Bouger les épaules pour transformer le mouvement en développé."],
  p:"Si les coudes sont sensibles, une barre coudée est nettement plus confortable qu'une barre droite. Charge modérée, l'articulation compte plus que le chiffre ici."},
 extnh:{n:"Extension nuque haltère",m:"Triceps, chef long",img:"Seated_Triceps_Press",pat:'ec',eq:2,ch:'kg',d:12,
  e:"Assis dos droit, un haltère tenu à deux mains au-dessus de la tête, bras tendus. Descends l'haltère derrière la nuque en pliant seulement les coudes, qui restent serrés vers l'avant. Descends jusqu'à l'étirement, puis pousse en haut.",
  err:["Ouvrir les coudes en grand, ce qui fait perdre l'étirement qui est justement l'intérêt de la position bras au-dessus de la tête.","Cambrer le bas du dos pour aider à pousser."],
  p:"Bras au-dessus de la tête, tu étires le chef long du triceps, celui que les extensions à la poulie travaillent mal. Garde-le dans le programme en complément, pas en remplacement."},
 kickt:{n:"Kickback triceps haltère",m:"Triceps",img:"Tricep_Dumbbell_Kickback",pat:'ec',eq:2,ch:'kg',d:6,
  e:"Buste penché à l'horizontale, une main en appui sur un banc, haltère dans l'autre main, coude remonté au niveau du buste et bloqué là. Tends le bras vers l'arrière jusqu'à l'extension complète, serre une seconde, reviens lentement.",
  err:["Laisser le coude descendre, ce qui remplace l'extension par un balancement d'épaule.","Prendre lourd : au-delà de quelques kilos, le mouvement devient impossible à tenir propre."],
  p:"Exercice de finition, léger, 12 à 20 répétitions. La contraction en fin de course est tout ce qu'il a à offrir, alors marque-la."},

 curlp:{n:"Curl à la poulie",m:"Biceps",img:"Standing_Biceps_Cable_Curl",pat:'fc',pat2:'avb',eq:0,ch:'kg',d:20,
  e:"Poulie basse, barre courte en prise supination, debout à un pas de la machine. Coudes collés au buste et fixes, monte la barre jusqu'aux épaules puis redescends lentement jusqu'à l'extension complète du coude.",
  err:["Reculer le buste pour lancer la charge.","Avancer les coudes en fin de montée, ce qui fait reposer le biceps en haut."],
  p:"La poulie garde de la tension du début à la fin, contrairement aux haltères qui sont légers en bas. Utile en fin de séance, en séries de 12 à 15."},

 dmm:{n:"Développé épaules machine",m:"Épaules, triceps",img:"Machine_Shoulder_Military_Press",pat:'pv',pat2:'ec',eq:0,ch:'kg',d:25,
  e:"Assis, dos plaqué contre le dossier, poignées à hauteur d'épaules. Pousse à la verticale jusqu'à bras presque tendus sans verrouiller les coudes, puis redescends jusqu'à ce que les mains reviennent à hauteur d'épaules.",
  err:["Décoller le dos du dossier pour pousser plus lourd.","Descendre les poignées bien en dessous des épaules, ce qui met l'articulation en position vulnérable."],
  p:"La machine tient la trajectoire à ta place, ce qui permet d'aller plus près de l'échec sans risque. Bon choix si le développé debout te fait cambrer."},

 velo:{n:"Vélo, intervalles",m:"Cardio, jambes",img:"Bicycling_Stationary",pat:'ca',eq:0,ch:'temps',d:0,
  e:"Règle la selle à hauteur de hanche, jambe presque tendue en bas de la pédale. Cinq minutes d'échauffement tranquille, puis alterne 40 secondes vite et 80 secondes calme, et termine par trois minutes de retour au calme.",
  err:["Selle trop basse, ce qui écrase le genou sur chaque coup de pédale.","Rester assis en tirant sur le guidon quand la résistance monte."],
  p:"Le vélo n'a pas d'impact au sol, c'est le cardio le plus facile à placer à côté d'un programme de musculation sans nuire à la récupération des jambes. Augmente la résistance avant la durée."},
 scappu:{n:"Tractions scapulaires",m:"Trapèzes, épaules arrière",img:"Scapular_Pull-Up",pat:'tra',pat2:'re',eq:3,ch:'aucune',d:0,
  e:"Suspendu à une barre, bras tendus, épaules relâchées vers les oreilles. Sans plier les coudes, abaisse les épaules et rapproche les omoplates : le corps remonte de quelques centimètres seulement. Tiens une seconde en haut, relâche lentement.",
  err:["Plier les coudes, ce qui en fait une traction courte au lieu d'un travail d'omoplates.","Chercher de l'amplitude : quelques centimètres suffisent, c'est normal."],
  p:"Le seul exercice de trapèzes et d'omoplates qui ne demande qu'une barre. C'est aussi le meilleur préparatif si les tractions complètes ne passent pas encore : 3 séries de 8 avant chaque séance de dos."},
 pompe:{n:"Pompes pieds surélevés",m:"Pectoraux haut, épaules, triceps",img:"Push-Ups_With_Feet_Elevated",pat:'ph',pat2:'pv',eq:3,ch:'lest',d:0,
  e:"Pieds posés sur un banc ou une chaise, mains au sol un peu plus larges que les épaules, corps en ligne. Plus les pieds sont hauts, plus la charge passe sur le haut des pectoraux et les épaules. Descends poitrine vers le sol, coudes vers l'arrière, puis pousse.",
  err:["Bassin qui s'affaisse une fois les pieds en hauteur, ce qui se paie en lombaires.","Monter les pieds trop haut d'un coup : commence à hauteur de chaise."],
  p:"C'est la façon de continuer à progresser aux pompes sans matériel : monte la hauteur des pieds avant d'ajouter des répétitions, puis passe au lest sur le dos."},
 pecdk:{n:"Pec deck (butterfly)",m:"Pectoraux",img:"Butterfly",pat:'ph',eq:0,ch:'kg',d:35,
  e:"Assis dos plaqué contre le dossier, règle le siège pour que les poignées arrivent à hauteur de poitrine. Coudes légèrement fléchis et fixes, rapproche les bras devant toi en serrant les pectoraux, marque un temps, puis reviens lentement jusqu'à sentir l'étirement.",
  err:["Décoller le dos du dossier pour pousser avec les épaules.","Laisser les bras partir trop loin en arrière au retour, ce qui met l'épaule en danger.","Plier les coudes en cours de route, ce qui transforme l'écarté en poussée."],
  p:"Machine d'isolation : la sensation prime sur la charge. Ajoute une plaque quand les 15 répétitions sortent avec un temps d'arrêt propre bras fermés."},
 chpm:{n:"Chest press à la machine",m:"Pectoraux, triceps",img:"Leverage_Chest_Press",pat:'ph',pat2:'ec',eq:0,ch:'kg',d:40,
  e:"Règle le siège pour que les poignées soient à hauteur du milieu des pectoraux. Omoplates serrées contre le dossier, pousse devant toi sans verrouiller brutalement les coudes, puis reviens en contrôlant jusqu'à l'étirement.",
  err:["Siège trop bas, qui fait pousser vers le haut et charge les épaules.","Décoller les omoplates du dossier en fin de poussée.","Laisser les poignées revenir d'un coup."],
  p:"La trajectoire guidée permet d'aller plus près de l'échec sans risque : c'est un bon exercice pour finir une séance de poussée. Monte la charge quand tu dépasses le haut de la fourchette."},
 ecah:{n:"Écarté haltères",m:"Pectoraux",img:"Dumbbell_Flyes",pat:'ph',eq:2,ch:'kg',d:10,
  e:"Allongé sur un banc plat, haltères au-dessus de la poitrine, paumes face à face, coudes très légèrement fléchis. Ouvre les bras en arc de cercle jusqu'à sentir l'étirement des pectoraux, sans descendre sous le niveau du banc, puis referme en serrant.",
  err:["Descendre les coudes trop bas, ce qui tire sur l'avant de l'épaule.","Plier franchement les coudes pour soulever plus lourd.","Cogner les haltères en haut, ce qui relâche la tension."],
  p:"Charge légère, amplitude contrôlée. La tension disparaît en haut : arrête le mouvement un peu avant que les haltères se touchent."},
 ecai:{n:"Écarté incliné haltères",m:"Haut des pectoraux",img:"Incline_Dumbbell_Flyes",pat:'ph',eq:2,ch:'kg',d:8,
  e:"Banc incliné à 30°, haltères au-dessus de la poitrine, coudes légèrement fléchis. Ouvre les bras en arc de cercle jusqu'à l'étirement du haut des pectoraux, puis referme en gardant la même courbure des coudes.",
  err:["Incliner le banc à 45° ou plus, ce qui donne le travail aux épaules.","Descendre plus bas que l'épaule ne le permet confortablement.","Transformer le mouvement en développé en pliant les coudes."],
  p:"Complète bien un développé couché à plat. Reste sur une charge qui permet de sentir l'étirement sans douleur à l'avant de l'épaule."},
 ecab:{n:"Écarté poulie basse",m:"Haut des pectoraux",img:"Low_Cable_Crossover",pat:'ph',eq:0,ch:'kg',d:6,
  e:"Entre deux poulies basses, une poignée dans chaque main, un pas en avant. Coudes légèrement fléchis, ramène les mains de bas en haut devant toi jusqu'à hauteur des épaules, en serrant le haut des pectoraux, puis redescends lentement.",
  err:["Monter les mains au-dessus des épaules, ce qui passe le travail aux deltoïdes.","Tirer avec les biceps en pliant les coudes.","Se pencher en arrière pour lancer la charge."],
  p:"La poulie garde la tension tout au long du mouvement. Travaille en séries de 12 à 15 et monte la charge par petits paliers."},
 rwapp:{n:"Rowing buste appuyé haltères",m:"Dos, arrière d'épaule",img:"Dumbbell_Incline_Row",pat:'th',pat2:'re',eq:2,ch:'kg',d:16,
  e:"Allongé sur le ventre sur un banc incliné à 30-45°, poitrine en appui, un haltère dans chaque main, bras tendus. Tire les coudes vers le haut et l'arrière en serrant les omoplates, marque un temps, puis redescends en contrôlant.",
  err:["Décoller la poitrine du banc pour tricher avec le buste.","Hausser les épaules vers les oreilles au lieu de serrer les omoplates.","Tirer uniquement avec les bras sans rapprocher les omoplates."],
  p:"Le banc soutient le buste : aucune contrainte sur le bas du dos. C'est le rowing à privilégier en cas de gêne lombaire. Augmente les haltères quand la dernière répétition garde le temps d'arrêt."},
 tbar:{n:"Rowing T-bar",m:"Dos, épaisseur",img:"T-Bar_Row_with_Handle",pat:'th',pat2:'lo',eq:1,ch:'kg',d:30,
  e:"À cheval sur la barre, une extrémité calée dans un coin ou un support, poignée en V sous les disques. Genoux fléchis, buste penché à 45°, dos plat. Tire la poignée vers le bas de la poitrine en serrant les omoplates, puis redescends bras tendus.",
  err:["Arrondir le bas du dos sous la charge.","Redresser le buste à chaque répétition pour lancer la barre.","Tirer vers le cou plutôt que vers le bas de la poitrine."],
  p:"Permet de charger lourd sur le dos en gardant une trajectoire simple. Si le bas du dos fatigue avant le dos, remplace-le par le rowing buste appuyé."},
 rwm:{n:"Rowing à la machine",m:"Dos",img:"Leverage_Iso_Row",pat:'th',eq:0,ch:'kg',d:40,
  e:"Assis, poitrine contre l'appui, règle le siège pour que les poignées arrivent à hauteur du bas des pectoraux. Tire les coudes vers l'arrière en serrant les omoplates, marque un temps, puis relâche lentement jusqu'à l'étirement complet du dos.",
  err:["Décoller la poitrine de l'appui pour tirer avec le buste.","Écourter le retour et perdre l'étirement.","Hausser les épaules en tirant."],
  p:"Trajectoire guidée, facile à charger et à pousser près de l'échec. Pense à étirer le dos à chaque retour : c'est la moitié du travail."},
 tbt:{n:"Tirage bras tendus à la poulie",m:"Grand dorsal",img:"Straight-Arm_Pulldown",pat:'tv',eq:0,ch:'kg',d:20,
  e:"Face à une poulie haute, barre en main, bras tendus devant toi, léger penché du buste. Coudes presque verrouillés, ramène la barre en arc de cercle jusqu'aux cuisses en pensant à tirer avec le dos, puis remonte lentement.",
  err:["Plier les coudes, ce qui transforme le mouvement en extension triceps.","Se pencher de plus en plus pour descendre la barre.","Laisser remonter la barre d'un coup."],
  p:"Isole le grand dorsal sans les biceps : idéal pour apprendre à sentir le dos avant les tractions. Travaille en séries de 12 à 15."},
 pull:{n:"Pull-over haltère",m:"Grand dorsal, pectoraux",img:"Bent-Arm_Dumbbell_Pullover",pat:'tv',pat2:'ph',eq:2,ch:'kg',d:14,
  e:"Allongé sur un banc, haltère tenu à deux mains au-dessus de la poitrine, coudes légèrement fléchis. Descends l'haltère derrière la tête en arc de cercle jusqu'à sentir l'étirement du dos et des pectoraux, puis ramène-le au-dessus de la poitrine.",
  err:["Descendre trop bas, au-delà de la souplesse des épaules.","Plier et tendre les coudes pendant le mouvement.","Cambrer fortement le dos pour gagner de l'amplitude."],
  p:"Exercice d'étirement autant que de force : reste modéré en charge et contrôle la descente. Arrête l'amplitude dès que les épaules tirent."},
 oisp:{n:"Oiseau à la poulie",m:"Arrière d'épaule",img:"Cable_Rear_Delt_Fly",pat:'re',eq:0,ch:'kg',d:4,
  e:"Entre deux poulies réglées à hauteur d'épaule, câbles croisés, poignée gauche dans la main droite et inversement. Bras presque tendus, ouvre les bras vers l'arrière à hauteur d'épaule, puis reviens lentement.",
  err:["Serrer les omoplates au maximum, ce qui donne le travail aux trapèzes.","Tirer avec les bras en pliant les coudes.","Charger trop lourd pour ce petit muscle."],
  p:"L'arrière d'épaule répond aux séries longues : 15 à 20 répétitions, charge légère. C'est un bon contrepoids à tous les exercices de poussée."},
 pp:{n:"Push press",m:"Épaules, triceps, jambes",img:"Push_Press",pat:'pv',pat2:'ec',eq:1,ch:'kg',d:40,
  e:"Debout, barre posée sur le haut de la poitrine, prise un peu plus large que les épaules. Plie légèrement les genoux, puis pousse avec les jambes et enchaîne en poussant la barre au-dessus de la tête, bras tendus. Redescends la barre sur la poitrine en contrôlant.",
  err:["Plier les genoux trop bas, ce qui en fait un squat.","Cambrer le dos en fin de poussée.","Laisser retomber la barre sur la poitrine."],
  p:"L'élan des jambes permet de manier plus lourd qu'au développé militaire. C'est un exercice de force et de puissance, en séries courtes de 3 à 6."},
 dcs:{n:"Développé couché prise serrée",m:"Triceps, pectoraux",img:"Close-Grip_Barbell_Bench_Press",pat:'ec',pat2:'ph',eq:1,ch:'kg',d:45,cap:8,
  e:"Allongé sur le banc, mains à largeur d'épaules sur la barre, omoplates serrées. Descends la barre vers le bas des pectoraux en gardant les coudes près du corps, puis pousse en tendant les bras.",
  err:["Prise trop serrée, mains qui se touchent, ce qui agresse les poignets.","Coudes qui s'écartent, ce qui retire le travail des triceps.","Rebondir sur la poitrine."],
  p:"Plafonné à RPE 8, comme le développé couché : sans pareur, garde deux répétitions en réserve. C'est l'exercice lourd de référence pour les triceps."},
 dipm:{n:"Dips à la machine",m:"Triceps, pectoraux",img:"Dip_Machine",pat:'ec',pat2:'ph',eq:0,ch:'kg',d:40,

/* Anciens doublons retirés de la bibliothèque : ces identifiants peuvent encore
   figurer dans des séances ou des charges enregistrées. Ils pointent vers
   l'exercice conservé, sans réapparaître dans les listes (non énumérables). */
Object.entries({shrh:'shrH',mola:'molA'}).forEach(([ancien,garde])=>
  Object.defineProperty(EX,ancien,{value:EX[garde],enumerable:false}));

/* P = mouvement principal, figé sur les 8 semaines · A = accessoire, alterné entre séance A et B */
const HAUT=new Set(['ph','pv','tv','th','ep','re','fc','ec']);
const BAS=new Set(['eg','fh']);
function typeSeance(s){
  if(s.b) return 'bonus';
  let a=0,b=0;(s.x||[]).forEach(e=>{const p=(EX[e[0]]||{}).pat; if(HAUT.has(p))a++; else if(BAS.has(p))b++;});
  return b>a?'bas':'haut';
}

function rpeOf(w,id,role){
  const e=EX[id]; let r=baseRPE(w)+(role?0:1);

/* Les mouvements principaux ne bougent jamais. Les accessoires tournent
   par blocs de deux semaines, en piochant dans le même schéma moteur.   */
function rotation(w,id){
  const e=EX[id]; if(!e) return id;
  const mat=A.materiel??0;
  const l=Object.keys(EX).filter(o=>EX[o].pat===e.pat&&EX[o].eq>=mat).sort();
  const k=l.indexOf(id);
  if(l.length<2||k<0) return id;

const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   /* sans I, O, 0, 1 : dictables sans erreur */
const codeAlea=()=>Array.from({length:5},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');

async function partager(i){
  const s=SEANCES[i];
  if(!sb||!USER){ alert("Le partage demande un compte. Relance l'app pour en créer un."); return; }
  if(s.code){ offrirLien(s); return; }
  let code=null, err=null;
  for(let essai=0;essai<4&&!code;essai++){
    const c=codeAlea();
    const {error}=await sb.from('seances_partagees').insert({
      code:c, nom:s.nom.slice(0,60), auteur:USER.id,
      ex:s.ex.map(e=>({id:e.id,s:e.s,r:e.r,p:e.p}))   /* jamais les charges enregistrées */
    });
    if(!error) code=c; else err=error;
  }
  if(!code){ alert("Partage impossible : "+((err&&err.message)||'réessaie')); return; }
  s.code=code; save(); offrirLien(s);
}
function offrirLien(s){
  const lien=lienDe(s.code);
  if(navigator.share){
    navigator.share({title:s.nom,text:`Ma séance « ${s.nom} » sur Repère`,url:lien}).catch(()=>copier(lien,s.code));
  } else copier(lien,s.code);
}
function copier(lien,code){
  const fin=()=>alert("Lien copié.\n\n"+lien+"\n\nCode de secours à dicter : "+code);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(lien).then(fin,()=>alert(lien+"\n\nCode : "+code));
  else alert(lien+"\n\nCode : "+code);
}
async function importer(code){
  code=(code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<4) return;
  if(!sb){ alert("L'import demande une connexion."); return; }
  try{
    const {data,error}=await sb.rpc('lire_seance',{p_code:code}).maybeSingle();
    if(error) throw error;
    if(!data){ alert("Aucune séance ne correspond au code "+code+"."); return; }
    const ex=(Array.isArray(data.ex)?data.ex:[]).filter(e=>e&&EX[e.id]).slice(0,12)
      .map(e=>({id:e.id,s:borne(e.s,1,10,3),r:borne(e.r,1,600,10),p:sansBalise(e.p).slice(0,12)||'90 s'}));
    if(!ex.length){ alert("Cette séance ne contient aucun exercice reconnu."); return; }
    const nom=sansBalise(data.nom).slice(0,60)||'Séance';
    SEANCES.push({nom:nom+" (reçue)",ex});
    save(); listeLibres();
    const abs=ex.filter(e=>EX[e.id].eq<(A.materiel??0)).length;
    alert("« "+nom+" » a été ajoutée à tes séances."+

  }catch(e){ alert("Import impossible : "+e.message); }
}

function exosDe(p){
  const mat=matActif();

     travaillent en second : les fentes sortent aussi sous « fessiers », les

    return `<path d="${r.d}" class="${hit?'hit':'reg'}${!hit&&actif?' on':''}${!hit&&sel?' sel':''}"

  };

async function gen(){

    <div class="jauge"><i id="jb"></i></div>

  const maj=()=>{const b=document.getElementById('jb'),p=document.getElementById('jp');
    if(b)b.style.width=pct.toFixed(1)+'%'; if(p)p.textContent=Math.round(pct)+' %'};
  /* La progression réelle est inconnue : la barre approche 92 % puis attend la réponse. */
  const t=setInterval(()=>{ if(fini)return; pct=Math.min(94,pct+Math.max(.25,(94-pct)*.04)); maj(); },200);
  const el=null;
  PLAN=null;
  try{
    if(!sb) throw new Error("compte non connecté");
    const {data:{session}}=await sb.auth.getSession();
    if(!session) throw new Error("session expirée, relance l'app");
    const url=SB_URL.trim().replace(/\/$/,'')+'/functions/v1/generer';
    const opts={method:'POST',
      headers:{'Content-Type':'application/json',
               'Authorization':'Bearer '+session.access_token,
               'apikey':SB_KEY.trim()},
      body:JSON.stringify(payload())};
    /* Le réseau mobile lâche souvent pendant les vingt secondes de génération.
       On laisse 90 s, et on retente une fois : le serveur ayant mis le plan en
       cache, la seconde tentative revient instantanément et ne coûte rien.     */
    /* Le serveur met le plan en cache avant de répondre. Si la première tentative
       expire, les suivantes se contentent donc de réclamer ce qui est déjà calculé. */
    let r=null,derniere=null;
    const corps=JSON.parse(opts.body);
    for(let essai=0;essai<4;essai++){
      try{
        const ac=new AbortController();
        const minuteur=setTimeout(()=>ac.abort(),essai===0?150000:20000);
        if(essai>0){corps.cacheSeul=true; opts.body=JSON.stringify(corps);}
        const rep2=await fetch(url,Object.assign({signal:ac.signal},opts));
        clearTimeout(minuteur);
        if(essai>0&&rep2.status===404){          /* pas encore prêt : on patiente */
          const p=document.getElementById("jp");
          if(p)p.textContent="Le serveur termine, on récupère le résultat…";
          await new Promise(z=>setTimeout(z,8000));
          continue;
        }
        r=rep2; break;
      }catch(err){
        derniere=err;
        const p=document.getElementById("jp");
        if(p)p.textContent=essai===0?"Connexion lente, on récupère le résultat…":"Nouvelle tentative…";
        await new Promise(z=>setTimeout(z,3000));
      }
    }
    if(!r) throw new Error((derniere&&derniere.message)||"connexion perdue");
    const j=await r.json();
    console.log('Réponse de la fonction generer :',j);   /* visible dans la console */
    if(j.tentatives&&j.tentatives.length>1)
      showErr("Le programme a été généré, mais pas du premier coup : "+j.tentatives.join(' | '));
    if(!r.ok||!j.plan){
      const dg=j.diagnostic?' — '+JSON.stringify(j.diagnostic):'';
      throw new Error((j.erreur||('erreur HTTP '+r.status))+dg);
    }
    PLAN=nettoieArbre(j.plan);
    const n=PLAN.notes;
    if(n&&(n.retenues<n.demandees||!n.bonus)){
      showErr("Cycle généré, mais incomplet : "+n.retenues+" séances sur "+n.demandees
        +(n.bonus?"":", sans séance bonus")+". Touche « Régénérer mon cycle » pour retenter.");
    }
    /* Les exercices que le serveur a écartés sont signalés dans la synthèse,
       pas seulement dans un bandeau qui disparaît. */
    if(n&&n.refus&&n.refus.length) showErr(txtRefus(n.refus),'info');
  }catch(e){
    PLAN=null;
    showErr("Génération par IA indisponible. "+e.message+" — Le programme affiché vient des règles intégrées.");
  }
  fini=true; clearInterval(t); pct=100; maj();
  FINI=true; save();
  await new Promise(z=>setTimeout(z,380));
  synthese();
}

  for(let p=w-1;p>=0;p--){

    const L=LOG[key(p,s,i)];

    const pas=pasDe(x), monte=baseRPE(w)>baseRPE(p), u={kg:'kg',lest:'kg',aucune:'reps',temps:'s',dist:'m'}[x.ch];
    L.v=maxV(L);

    if(L.feel===0&&monte)
      return {v:L.v,reps:L.reps,t:`Même charge qu'en semaine ${p+1} : l'effort visé passe à RPE ${baseRPE(w)}, ce sera plus dur sans rien ajouter.`};
    if(L.feel===2)
      return {v:Math.max(0,L.v-pas),reps:L.reps,t:`−${nb(pas)} ${u} : la semaine ${p+1} était au-dessus de la cible.`};

/* Un état enregistré par une version plus ancienne peut contenir des champs
   qui ont changé de forme depuis. Le cas qui fait mal : « sport » était un
   numéro tant qu'on n'en acceptait qu'un, c'est devenu une liste. Sans cette
   remise en forme, buildQ() lève une erreur et l'app ne charge jamais rien.  */
function normaliser(A){
  const tab=v=>Array.isArray(v)?v:(typeof v==='number'?[v]:[]);
  const obj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};

  if(A.sport!==undefined&&!Array.isArray(A.sport)) A.sport=tab(A.sport);
  /* La fréquence était un nombre unique : on la rattache au premier sport. */
  if(A.sportFreq!==undefined&&(typeof A.sportFreq!=='object'||Array.isArray(A.sportFreq))){
    const n=typeof A.sportFreq==='number'?A.sportFreq:0;
    const prem=(A.sport||[]).filter(i=>i>0)[0];
    A.sportFreq = prem!==undefined?{[prem]:n}:{};
  }
  ['blessure','prio','exclus'].forEach(k=>{ if(A[k]!==undefined) A[k]=tab(A[k]); });
  ['prefs','charges','profil','sportFreq'].forEach(k=>{ if(A[k]!==undefined) A[k]=obj(A[k]); });
  Object.keys(A.prefs||{}).forEach(g=>{ if(!Array.isArray(A.prefs[g])) A.prefs[g]=[]; });
  return A;
}
function apply(s){
  if(!s)return false;
  Object.assign(A,s.A||{});Object.assign(LOG,s.LOG||{});Object.assign(SWAP,s.SWAP||{});Object.assign(SWAPP,s.SWAPP||{});PLAN=nettoieArbre(s.PLAN)||null;SEANCES=nettoieArbre(s.SEANCES)||[];
  wk=s.wk||0;day=s.day||0;FINI=!!s.FINI;
  normaliser(A);
  /* Dernier filet : un état illisible ne doit jamais empêcher l'app de
     démarrer. On repart alors du questionnaire en gardant séances et charges. */
  try{ Q=buildQ(); }
  catch(e){
    console.warn('État illisible, réponses réinitialisées :',e);
    Object.keys(A).forEach(k=>delete A[k]);
    FINI=false; Q=buildQ();
    showErr("Tes réponses au questionnaire venaient d'une version trop ancienne et n'ont pas pu être relues. Tes séances composées et tes charges sont intactes ; il faut refaire le questionnaire.",'info');
  }
  return true;
}

async function reset(){

  if(SEANCES.length) quoi.push(SEANCES.length+" séance"+(SEANCES.length>1?'s':'')+" composée"+(SEANCES.length>1?'s':''));

  if(!quoi.length) quoi.push("le peu qui est enregistré");
  if(!confirm("Tout effacer ?\n\nCe qui disparaît :\n· "+quoi.join("\n· ")
    +"\n\nIci comme sur le serveur, et c'est définitif. Tu repartiras du questionnaire."))return;
  try{
    if(sb&&USER){
      await sb.from('etats').delete().eq('user_id',USER.id);
      /* Sans ça, l'adresse resterait collée à un compte vide et ne pourrait
         plus jamais être rattachée ailleurs. La fonction est facultative :
         si elle n'est pas déployée, on continue quand même.                 */
      await oublierCompte();

async function signIn(){
  const i=document.getElementById('pin'), err=document.getElementById('perr');
  const champMail=document.getElementById('pmail');
  const p=sansBalise((i.value||'').trim());
  const mail=((champMail&&champMail.value)||'').trim().toLowerCase();
  if(p.length<2){err.textContent="Deux caractères au minimum.";return}
  /* L'adresse est facultative, mais si elle est saisie elle doit être plausible :
     autant le dire ici plutôt que d'envoyer un mail dans le vide. */
  if(mail&&!valideMail(mail)){err.textContent="Cette adresse n'a pas l'air valide. Corrige-la, ou laisse le champ vide.";return}
  PSEUDO=p; localStorage.setItem(PKEY,p);
  err.textContent="Création du compte…";
  try{
    const {data,error}=await sb.auth.signInAnonymously();
    if(error)throw error;
    USER=data.user;
    /* Le rattachement vient forcément après : avant, il n'y a pas de compte
       auquel rattacher quoi que ce soit. Et s'il échoue, on entre quand même. */
    if(mail) MAILRETOUR=await rattacherALaVolee(mail);
