# Intégration continue : à chaque PR et à chaque push sur main ou la branche de travail,
# l'app est vérifiée de bout en bout (types, lint, tests unitaires, build, scénarios e2e).
name: CI

on:
  pull_request:
  push:
    branches: [main, claude/app-muscu-deployment-plan-7398r6]

# Le jeton du workflow ne peut que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types
        run: |
          npx next typegen
          npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint .
      - name: Tests unitaires
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Playwright et Chromium
        run: |
          npm i -g @playwright/test@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)" /opt/pw-browsers/chromium
      - name: Scénarios e2e
        run: NODE_PATH="$(npm root -g)" node tests/e2e/tous.mjs
